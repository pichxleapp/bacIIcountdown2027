<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BACII 2027 — Countdown</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       ROOT & RESET
    ========================================= */
    :root {
      --bg-1: #060913;
      --bg-2: #0f1830;
      --bg-3: #152345;

      --accent: #4facfe;
      --accent-2: #00f2fe;
      --white: #ffffff;
      --muted: rgba(255, 255, 255, 0.62);

      --glass: rgba(255, 255, 255, 0.065);
      --glass-border: rgba(255, 255, 255, 0.13);

      --beat-scale: 1;
      --beat-x: 0px;
      --beat-y: 0px;
      --beat-glow: 0;
      --club-hue: 0deg;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      overflow-x: hidden;
      font-family: 'Poppins', 'Kantumruy Pro', sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 15% 20%, rgba(79, 172, 254, 0.18), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.12), transparent 30%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
    }

    /* =========================================
       ANIMATED BACKGROUND & PARTICLES
    ========================================= */
    body::before {
      content: "";
      position: fixed;
      inset: -50%;
      background: conic-gradient(
        from 0deg,
        transparent,
        rgba(79, 172, 254, 0.08),
        transparent,
        rgba(0, 242, 254, 0.07),
        transparent
      );
      animation: rotateBG 25s linear infinite;
      pointer-events: none;
      z-index: -3;
    }

    @keyframes rotateBG {
      to { transform: rotate(360deg); }
    }

    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(79, 172, 254, 0.8);
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(110vh) scale(0.5);
        opacity: 0;
      }
      10%, 90% { opacity: 1; }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* =========================================
       🪩 VIP NIGHTCLUB LIGHTING & LASER SYSTEM
    ========================================= */
    .club-lights {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.6s ease;
      mix-blend-mode: screen;
    }

    body.audio-reactive.club-mode-on .club-lights {
      opacity: 1;
    }

    /* Ceiling Sweeping Spotlight Cones */
    .spotlight {
      position: absolute;
      top: -18vh;
      width: 48vw;
      height: 135vh;
      transform-origin: 50% 0%;
      clip-path: polygon(47% 0%, 53% 0%, 100% 100%, 0% 100%);
      filter: blur(28px);
      opacity: calc(0.18 + var(--beat-glow) * 0.65);
      transition: opacity 0.06s linear;
    }

    .spotlight-1 {
      left: -8vw;
      background: linear-gradient(180deg, rgba(0, 242, 254, 0.95), rgba(0, 120, 255, 0.25) 60%, transparent 95%);
      animation: sweepBeam1 4.2s ease-in-out infinite alternate;
    }

    .spotlight-2 {
      left: 18vw;
      background: linear-gradient(180deg, rgba(255, 0, 128, 0.95), rgba(180, 0, 255, 0.25) 60%, transparent 95%);
      animation: sweepBeam2 3.6s ease-in-out infinite alternate;
    }

    .spotlight-3 {
      right: 18vw;
      background: linear-gradient(180deg, rgba(162, 0, 255, 0.95), rgba(0, 225, 255, 0.25) 60%, transparent 95%);
      animation: sweepBeam3 4.8s ease-in-out infinite alternate;
    }

    .spotlight-4 {
      right: -8vw;
      background: linear-gradient(180deg, rgba(0, 255, 157, 0.95), rgba(0, 195, 255, 0.25) 60%, transparent 95%);
      animation: sweepBeam4 3.9s ease-in-out infinite alternate;
    }

    @keyframes sweepBeam1 {
      from { transform: rotate(-36deg); }
      to { transform: rotate(22deg); }
    }
    @keyframes sweepBeam2 {
      from { transform: rotate(26deg); }
      to { transform: rotate(-24deg); }
    }
    @keyframes sweepBeam3 {
      from { transform: rotate(-22deg); }
      to { transform: rotate(28deg); }
    }
    @keyframes sweepBeam4 {
      from { transform: rotate(34deg); }
      to { transform: rotate(-20deg); }
    }

    /* Sharp Club Laser Beams */
    .laser-container {
      position: absolute;
      inset: 0;
      opacity: calc(var(--beat-glow) * 0.95);
    }

    .laser-line {
      position: absolute;
      top: -5vh;
      width: 2px;
      height: 125vh;
      transform-origin: top center;
      filter: drop-shadow(0 0 8px currentColor);
    }

    .laser-1 {
      left: 15%;
      color: #00f2fe;
      background: linear-gradient(180deg, #ffffff, #00f2fe, transparent);
      animation: laserScan1 1.8s ease-in-out infinite alternate;
    }

    .laser-2 {
      left: 50%;
      color: #ff007f;
      background: linear-gradient(180deg, #ffffff, #ff007f, transparent);
      animation: laserScan2 1.4s ease-in-out infinite alternate;
    }

    .laser-3 {
      left: 85%;
      color: #00ff88;
      background: linear-gradient(180deg, #ffffff, #00ff88, transparent);
      animation: laserScan3 1.6s ease-in-out infinite alternate;
    }

    @keyframes laserScan1 {
      from { transform: rotate(-42deg); }
      to { transform: rotate(35deg); }
    }
    @keyframes laserScan2 {
      from { transform: rotate(38deg); }
      to { transform: rotate(-38deg); }
    }
    @keyframes laserScan3 {
      from { transform: rotate(40deg); }
      to { transform: rotate(-32deg); }
    }

    /* Bass Strobe Edge Vignette & Floor Glow */
    .club-strobe {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, calc(var(--beat-glow) * 0.22)), transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(255, 0, 128, calc(var(--beat-glow) * 0.28)), transparent 65%);
      box-shadow: inset 0 0 calc(var(--beat-glow) * 90px) rgba(0, 242, 254, 0.35);
      filter: hue-rotate(var(--club-hue));
    }

    /* =========================================
       MAIN CONTAINER (WITH RGB CLUB BORDER)
    ========================================= */
    .container {
      position: relative;
      width: min(950px, 100%);
      padding: clamp(25px, 5vw, 60px);
      text-align: center;
      background: linear-gradient(
        135deg,
        rgba(14, 22, 42, 0.72),
        rgba(8, 14, 28, 0.58)
      );
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow:
        0 35px 100px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
      animation: containerIn 1s ease-out;
    }

    /* Animated RGB Neon Ring Around Container in Club Mode */
    body.audio-reactive.club-mode-on .container {
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow:
        0 35px 100px rgba(0, 0, 0, 0.65),
        0 0 calc(var(--beat-glow) * 55px) hsla(var(--club-hue), 100%, 60%, 0.55),
        inset 0 0 calc(var(--beat-glow) * 25px) hsla(var(--club-hue), 100%, 60%, 0.25);
    }

    @keyframes containerIn {
      from {
        opacity: 0;
        transform: translateY(35px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =========================================
       HEADER
    ========================================= */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      margin-bottom: 18px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--accent-2);
      background: rgba(0, 242, 254, 0.07);
      border: 1px solid rgba(0, 242, 254, 0.15);
      border-radius: 999px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background: var(--accent-2);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-2);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.5;
        transform: scale(0.8);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    .title {
      font-size: clamp(28px, 6vw, 64px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(
        135deg,
        #ffffff 10%,
        #8fdcff 50%,
        #00f2fe 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: clamp(12px, 2.5vw, 15px);
      font-weight: 400;
      letter-spacing: 0.5px;
      min-height: 24px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.35s ease, color 0.25s ease;
    }

    .subtitle:hover {
      color: #ffffff;
    }

    /* =========================================
       COUNTDOWN
    ========================================= */
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(10px, 2vw, 20px);
      margin-top: clamp(25px, 5vw, 45px);
    }

    .box {
      position: relative;
      min-width: 0;
      padding: clamp(15px, 3vw, 30px) 10px;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.075),
        rgba(0, 0, 0, 0.16)
      );
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 18px;
      overflow: hidden;
      transition:
        transform 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease;
    }

    .box::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--accent-2),
        transparent
      );
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      to { left: 100%; }
    }

    .box:hover {
      transform: translateY(-8px) scale(1.025);
      border-color: rgba(79, 172, 254, 0.35);
      box-shadow: 0 15px 40px rgba(0, 242, 254, 0.10);
    }

    .number {
      display: block;
      font-size: clamp(28px, 6vw, 68px);
      line-height: 1;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: white;
      text-shadow: 0 0 25px rgba(79, 172, 254, 0.35);
    }

    .number.tick {
      animation: numberTick 0.25s ease;
    }

    @keyframes numberTick {
      50% {
        transform: translateY(-4px) scale(1.04);
        text-shadow: 0 0 35px rgba(0, 242, 254, 0.8);
      }
    }

    .label {
      display: block;
      margin-top: 10px;
      color: var(--accent-2);
      font-size: clamp(10px, 1.8vw, 12px);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* =========================================
       PROGRESS SECTION
    ========================================= */
    .progress-section {
      margin-top: clamp(30px, 5vw, 45px);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    #progress-text {
      color: var(--accent-2);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    }

    .progress-track {
      position: relative;
      width: 100%;
      height: 58px;
      display: flex;
      align-items: center;
      --progress: 0%;
    }

    .progress-bar {
      position: relative;
      width: 100%;
      height: 9px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.4);
    }

    .progress-fill {
      position: relative;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        #0756d9,
        #00c8ff,
        #8be9ff
      );
      box-shadow:
        0 0 10px #00c8ff,
        0 0 22px rgba(0, 200, 255, 0.55);
      transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 20%,
        rgba(255, 255, 255, 0.85) 50%,
        transparent 80%
      );
      animation: progressShimmer 2s linear infinite;
    }

    @keyframes progressShimmer {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    /* =========================================
       SASUKE RUNNER + CHAKRA AURA & CHIDORI SVG
    ========================================= */
    .sasuke-runner {
      position: absolute;
      z-index: 5;
      width: 54px;
      height: 54px;
      top: 50%;
      left: clamp(27px, var(--progress), calc(100% - 27px));
      transform: translate(-50%, -50%);
      transition: left 1s cubic-bezier(0.22, 1, 0.36, 1);
      animation: runnerBounce 0.32s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .chakra-svg {
      position: absolute;
      inset: -16px;
      width: calc(100% + 32px);
      height: calc(100% + 32px);
      z-index: 1;
      overflow: visible;
      transform: scale(calc(1 + var(--beat-glow) * 0.32));
      transition: transform 0.08s ease-out;
    }

    .chakra-aura-outer {
      fill: rgba(0, 195, 255, 0.18);
      stroke: #00e1ff;
      stroke-width: 1.5;
      filter: drop-shadow(0 0 8px #00c8ff);
      transform-origin: center;
      animation: chakraPulse 0.65s ease-in-out infinite alternate;
    }

    .chakra-aura-inner {
      fill: rgba(140, 235, 255, 0.25);
      stroke: #ffffff;
      stroke-width: 1;
      transform-origin: center;
      animation: chakraPulseInner 0.45s ease-in-out infinite alternate;
    }

    .chidori-arc {
      fill: none;
      stroke: #b8f4ff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px #00f2fe);
      opacity: 0.85;
    }

    .chidori-arc.arc-1 {
      animation: chidoriFlicker1 0.22s steps(2, end) infinite;
    }

    .chidori-arc.arc-2 {
      animation: chidoriFlicker2 0.18s steps(2, end) infinite;
    }

    .sasuke-img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 calc(6px + var(--beat-glow) * 10px) #00c8ff);
    }

    @keyframes runnerBounce {
      from { margin-top: -3px; }
      to { margin-top: 3px; }
    }

    @keyframes chakraPulse {
      from {
        opacity: 0.45;
        transform: scale(0.92) rotate(-3deg);
      }
      to {
        opacity: 0.95;
        transform: scale(1.08) rotate(3deg);
      }
    }

    @keyframes chakraPulseInner {
      from {
        opacity: 0.35;
        transform: scale(0.88);
      }
      to {
        opacity: 0.85;
        transform: scale(1.04);
      }
    }

    @keyframes chidoriFlicker1 {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 0.15; transform: scale(0.94) rotate(6deg); }
    }

    @keyframes chidoriFlicker2 {
      0%, 100% { opacity: 0.2; transform: scale(0.95) rotate(-5deg); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .chakra-trail {
      position: absolute;
      top: 50%;
      left: 0;
      width: var(--progress);
      height: 4px;
      transform: translateY(-50%);
      pointer-events: none;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(0, 200, 255, 0.35),
        #00f2fe
      );
      filter: blur(2px);
      opacity: 0.9;
    }

    .progress-track.complete .progress-fill {
      background: linear-gradient(
        90deg,
        #00c853,
        #69f0ae,
        #b9f6ca
      );
      box-shadow: 0 0 20px rgba(0, 255, 130, 0.8);
    }

    .progress-track.complete .sasuke-img {
      filter: drop-shadow(0 0 12px #00ff88);
    }

    /* =========================================
       BOTTOM INFORMATION
    ========================================= */
    .info-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 25px;
    }

    .current-time {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .current-time strong {
      color: white;
      font-weight: 500;
    }

    .pills-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .target-date {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
    }

    .target-date strong {
      color: white;
      font-weight: 600;
    }

    .finished {
      grid-column: 1 / -1;
      padding: 40px 10px;
      font-size: clamp(20px, 5vw, 48px);
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: celebration 1s ease-in-out infinite alternate;
    }

    @keyframes celebration {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    /* =========================================
       VIP DYNAMIC ISLAND & PLAYLIST DRAWER
    ========================================= */
    .music-wrapper {
      position: fixed;
      bottom: 22px;
      left: 22px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .music-banner {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 9px 13px;
      overflow: hidden;
      background: linear-gradient(
        135deg,
        rgba(14, 24, 46, 0.92),
        rgba(8, 14, 28, 0.96)
      );
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(0, 210, 255, 0.22);
      border-radius: 999px;
      box-shadow:
        0 14px 36px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.12);
      transition:
        border-color 0.35s ease,
        box-shadow 0.35s ease;
      transform: none !important;
    }

    .music-banner:hover,
    .music-banner.volume-visible {
      border-color: rgba(0, 242, 254, 0.45);
      box-shadow:
        0 18px 42px rgba(0, 0, 0, 0.55),
        0 0 22px rgba(0, 210, 255, 0.16),
        inset 0 1px 1px rgba(255, 255, 255, 0.18);
    }

    /* Play Button */
    .music-play-btn {
      position: relative;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      color: white;
      background: linear-gradient(135deg, #0768c9, #00d2ff);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 200, 255, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .music-play-btn::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent,
        #00f2fe,
        transparent,
        #ff007f,
        transparent
      );
      opacity: 0;
      z-index: -1;
      transition: opacity 0.35s ease;
    }

    .music-banner.is-playing .music-play-btn::before {
      opacity: 0.9;
      animation: rotateBG 2.5s linear infinite;
    }

    .music-play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 22px rgba(0, 225, 255, 0.65);
    }

    .music-play-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      display: block;
    }

    /* Prev & Next Track Mini Buttons */
    .nav-track-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #bfefff;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-left: 5px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .nav-track-btn:hover {
      background: rgba(0, 242, 254, 0.18);
      color: #ffffff;
      transform: scale(1.08);
    }

    .nav-track-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    /* Track Info */
    .music-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-left: 9px;
      padding-right: 4px;
      white-space: nowrap;
      cursor: pointer;
    }

    .music-status-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .music-status {
      color: #00e1ff;
      font-size: 9px;

    let volumeTimeout = null;
    let isPointerInside = false;
    let lastSavedVolume = Number(localStorage.getItem("bacii_volume") ?? 70);

    /* =========================================
       3. MOTIVATIONAL QUOTES ROTATOR
    ========================================= */
    const QUOTES = [
      "Knowledge is the key to success",
      "ការខិតខំថ្ងៃនេះ គឺជាផ្លែផ្កាថ្ងៃស្អែក — ឆ្ពោះទៅរកបាក់ឌុប ២០២៧",
      "Every hour of study brings you closer to your goal",
      "កុំបោះបង់! ការនឿយហត់ពេលនេះ នឹងប្ដូរមកវិញនូវស្នាមញញឹមថ្ងៃប្រកាសលទ្ធផល",
      "Discipline beats motivation — Stay focused!"
    ];
    let quoteIndex = 0;

    function cycleQuote() {
      quoteSubtitle.style.opacity = "0";
      setTimeout(() => {
        quoteIndex = (quoteIndex + 1) % QUOTES.length;
        quoteSubtitle.textContent = QUOTES[quoteIndex];
        quoteSubtitle.style.opacity = "1";
      }, 300);
    }

    quoteSubtitle.addEventListener("click", cycleQuote);
    setInterval(cycleQuote, 8000);

    /* =========================================
       4. COUNTDOWN & CLOCK FUNCTIONS
    ========================================= */
    function pad(number) {
      return String(number).padStart(2, "0");
    }

    function updateNumber(element, value) {
      if (!element) return;
      const formatted = pad(value);
      if (element.textContent !== formatted) {
        element.textContent = formatted;
        element.classList.remove("tick");
        void element.offsetWidth;
        element.classList.add("tick");
      }
    }

    function updateCurrentTime() {
      const now = new Date();
      const cambodiaTime = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Phnom_Penh",
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(now);

      currentTimeElement.textContent = cambodiaTime;
    }

    function updateProgress(now) {
      const totalDuration = TARGET_DATE - START_DATE;
      const elapsed = now - START_DATE;
      let progress = (elapsed / totalDuration) * 100;
      progress = Math.max(0, Math.min(100, progress));

      const percentage = progress.toFixed(2) + "%";
      progressFill.style.width = percentage;
      progressText.textContent = percentage;
      progressTrack.style.setProperty("--progress", progress + "%");
      progressTrack.classList.toggle("complete", progress >= 100);
    }

    function updateCountdown() {
      const now = Date.now();
      const difference = TARGET_DATE - now;

      updateProgress(now);

      if (difference <= 0) {
        countdownWrapper.innerHTML = `
          <div class="finished">
            🎉 The Day Has Arrived!
          </div>
        `;
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
      );
      const minutes = Math.floor(
        (difference % (1000 * 60 * 60)) / (1000 * 60)
      );
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      updateNumber(daysElement, days);
      updateNumber(hoursElement, hours);
      updateNumber(minutesElement, minutes);
      updateNumber(secondsElement, seconds);
    }

    function createParticles() {
      const container = document.getElementById("particles");
      const amount = window.innerWidth < 600 ? 25 : 45;

      for (let i = 0; i < amount; i++) {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.animationDuration = (8 + Math.random() * 15) + "s";
        particle.style.animationDelay = Math.random() * 15 + "s";

        const size = 1 + Math.random() * 3;
        particle.style.width = size + "px";
        particle.style.height = size + "px";

        container.appendChild(particle);
      }
    }

    /* =========================================
       5. BULLETPROOF PLAYLIST & AUDIO ENGINE
    ========================================= */
    function bindAudioEvents(audioEl) {
      audioEl.addEventListener("ended", () => {
        playNextTrack();
      });

      audioEl.addEventListener("timeupdate", () => {
        if (audioEl.duration && Number.isFinite(audioEl.duration)) {
          const pct = (audioEl.currentTime / audioEl.duration) * 100;
          musicProgressBar.style.width = pct.toFixed(1) + "%";
        }
      });

      audioEl.addEventListener("waiting", () => {
        if (!audioEl.paused) {
          musicStatus.textContent = "LOADING...";
        }
      });

      audioEl.addEventListener("playing", () => {
        setPlayingUI(true);
      });

      audioEl.addEventListener("pause", () => {
        if (!audioEl.ended) {
          setPlayingUI(false);
        }
      });
    }

    bindAudioEvents(music);

    function rebuildAudioElementWithoutCors(srcUrl) {
      useSimulatedBeat = true;
      const freshAudio = document.createElement("audio");
      freshAudio.id = "bg-music";
      freshAudio.preload = "auto";
      freshAudio.volume = Number(volumeWheel.value) / 100;
      freshAudio.src = srcUrl;

      music.pause();
      music.replaceWith(freshAudio);
      music = freshAudio;
      bindAudioEvents(music);
    }

    function applyVolume(vol) {
      music.volume = vol / 100;
      volumeWheel.value = vol;
      volumeWheel.style.setProperty("--vol-pct", vol + "%");
      volumeValue.textContent = vol + "%";

      if (vol === 0) volumeSvg.innerHTML = ICON_VOL_MUTE;
      else if (vol <= 50) volumeSvg.innerHTML = ICON_VOL_LOW;
      else volumeSvg.innerHTML = ICON_VOL_HIGH;

      localStorage.setItem("bacii_volume", String(vol));
    }

    function showVolume(duration = 2200) {
      musicBanner.classList.add("volume-visible");
      clearTimeout(volumeTimeout);
      if (!isPointerInside) {
        volumeTimeout = setTimeout(() => {
          musicBanner.classList.remove("volume-visible");
        }, duration);
      }
    }

    function renderPlaylistUI() {
      playlistTracks.innerHTML = "";
      playlistCount.textContent = `${PLAYLIST.length} បទ`;

      PLAYLIST.forEach((track, idx) => {
        const isCurrent = idx === currentTrackIndex;
        const item = document.createElement("div");
        item.className = `playlist-item ${isCurrent ? "active" : ""}`;

        const nameSpan = document.createElement("span");
        nameSpan.className = "playlist-item-name";
        nameSpan.textContent = `${idx + 1}. ${track.title}`;
        item.appendChild(nameSpan);

        if (isCurrent) {
          const statusSpan = document.createElement("span");
          statusSpan.className = "playlist-item-playing-icon";
          statusSpan.textContent = music.paused ? "● SELECTED" : "▶ PLAYING";
          item.appendChild(statusSpan);
        }

        item.addEventListener("click", (e) => {
          e.stopPropagation();
          if (idx === currentTrackIndex) {
            toggleMusic();
          } else {
            loadTrack(idx, true);
          }
        });

        playlistTracks.appendChild(item);
      });
    }

    function setupAudioAnalyzer() {
      if (audioContext || useSimulatedBeat) return;
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.25;

        source = audioContext.createMediaElementSource(music);
        source.connect(analyser);
        analyser.connect(audioContext.destination);

        frequencyData = new Uint8Array(analyser.frequencyBinCount);
      } catch (err) {
        console.warn("Web Audio Analyzer fallback enabled:", err);
        useSimulatedBeat = true;
      }
    }

    async function safePlayCurrentTrack(requestId) {
      musicStatus.textContent = "LOADING...";

      try {
        setupAudioAnalyzer();
        if (audioContext && audioContext.state === "suspended") {
          await audioContext.resume();
        }

        const playPromise = music.play();
        if (playPromise !== undefined) {
          await playPromise;
        }

        if (requestId !== playRequestId) return;
        setPlayingUI(true);
      } catch (error) {
        if (error.name === "AbortError" || requestId !== playRequestId) {
          return;
        }

        console.warn("CORS restriction on track, switching to direct audio output...", error);
        const currentSrc = PLAYLIST[currentTrackIndex].src;
        rebuildAudioElementWithoutCors(currentSrc);

        try {
          await music.play();
          if (requestId !== playRequestId) return;
          setPlayingUI(true);
        } catch (finalError) {
          if (finalError.name !== "AbortError") {
            console.error("Track cannot be played:", finalError);
            musicStatus.textContent = "ERROR";
            setPlayingUI(false);
          }
        }
      }
    }

    function loadTrack(index, autoPlay = true) {
      if (index < 0) index = PLAYLIST.length - 1;
      if (index >= PLAYLIST.length) index = 0;

      currentTrackIndex = index;
      localStorage.setItem("bacii_track_idx", String(index));

      const track = PLAYLIST[index];
      const currentReqId = ++playRequestId;

      music.pause();
      musicProgressBar.style.width = "0%";
      musicName.textContent = track.title;

      if (!useSimulatedBeat) {
        music.crossOrigin = "anonymous";
      } else {
        music.removeAttribute("crossorigin");
      }

      music.src = track.src;
      music.load();
      renderPlaylistUI();

      if (autoPlay) {
        safePlayCurrentTrack(currentReqId);
      } else {
        musicStatus.textContent = "READY";
      }
    }

    async function toggleMusic() {
      showVolume(2600);
      const currentReqId = ++playRequestId;

      if (music.paused) {
        await safePlayCurrentTrack(currentReqId);
      } else {
        music.pause();
        setPlayingUI(false);
      }
    }

    function playNextTrack() {
      loadTrack(currentTrackIndex + 1, true);
    }

    function playPrevTrack() {
      if (music.currentTime > 4) {
        music.currentTime = 0;
      } else {
        loadTrack(currentTrackIndex - 1, true);
      }
    }

    function setPlayingUI(isPlaying) {
      if (isPlaying) {
        playPauseIcon.innerHTML = ICON_PAUSE;
        musicStatus.textContent = "NOW PLAYING";
        musicBanner.classList.add("is-playing");
        eqBarsContainer.classList.add("playing");
        document.body.classList.add("audio-reactive");
        startBeatEffect();
      } else {
        playPauseIcon.innerHTML = ICON_PLAY;
        if (musicStatus.textContent !== "ERROR") {
          musicStatus.textContent = "PAUSED";
        }
        musicBanner.classList.remove("is-playing");
        eqBarsContainer.classList.remove("playing");
        stopBeatEffect();
      }
      renderPlaylistUI();
    }

    /* =========================================
       6. EVENT LISTENERS
    ========================================= */
    musicButton.addEventListener("click", toggleMusic);
    prevTrackBtn.addEventListener("click", playPrevTrack);
    nextTrackBtn.addEventListener("click", playNextTrack);

    /* Club Mode Toggle Button */
    clubToggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("club-mode-on");
      clubToggleBtn.classList.toggle("active");
    });

    musicBanner.addEventListener("mouseenter", () => {
      isPointerInside = true;
      clearTimeout(volumeTimeout);
      musicBanner.classList.add("volume-visible");
    });

    musicBanner.addEventListener("mouseleave", () => {
      isPointerInside = false;
      showVolume(1400);
    });

    musicInfoTrigger.addEventListener("click", () => {
      showVolume(2800);
    });

    playlistToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      playlistDrawer.classList.toggle("open");
      playlistToggle.classList.toggle("active");
    });

    document.addEventListener("click", (e) => {
      if (!playlistDrawer.contains(e.target) && !playlistToggle.contains(e.target)) {
        playlistDrawer.classList.remove("open");
        playlistToggle.classList.remove("active");
      }
    });

    addLocalBtn.addEventListener("click", () => {
      localAudioInput.click();
    });

    localAudioInput.addEventListener("change", (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      files.forEach((file) => {
        const cleanName = file.name.replace(/\.[^/.]+$/, "");
        const blobUrl = URL.createObjectURL(file);
        PLAYLIST.push({
          title: cleanName,
          src: blobUrl,
          isLocal: true
        });
      });

      const newestIndex = PLAYLIST.length - files.length;
      loadTrack(newestIndex, true);
      localAudioInput.value = "";
    });

    volumeWheel.addEventListener("input", () => {
      const volume = Number(volumeWheel.value);
      if (volume > 0) lastSavedVolume = volume;
      applyVolume(volume);
      showVolume(2500);
    });

    volumeIcon.addEventListener("click", () => {
      if (music.volume > 0) {
        applyVolume(0);
      } else {
        applyVolume(lastSavedVolume || 70);
      }
      showVolume(2500);
    });

    /* =========================================
       7. REAL-TIME BASS + CLUB RGB HUE ENGINE
    ========================================= */
    function startBeatEffect() {
      cancelAnimationFrame(animationId);
      beatPulse = 0;
      averageBass = 0;
      lastBeatTime = 0;

      function animate() {
        if (music.paused) return;

        const now = performance.now();
        let bass = 0;

        if (!useSimulatedBeat && analyser && frequencyData) {
          analyser.getByteFrequencyData(frequencyData);

          const binHz = audioContext.sampleRate / analyser.fftSize;
          const startBin = Math.max(1, Math.floor(35 / binHz));
          const endBin = Math.min(frequencyData.length - 1, Math.ceil(150 / binHz));

          let count = 0;
          for (let i = startBin; i <= endBin; i++) {
            bass += frequencyData[i];
            count++;
          }
          bass = count ? bass / count : 0;

          const step = Math.floor(endBin / 4) || 1;
          eqBars.forEach((bar, idx) => {
            const val = frequencyData[startBin + idx * step] || 0;
            const h = Math.max(2, (val / 255) * 10);
            bar.style.height = h.toFixed(1) + "px";
          });
        } else {
          bass = 65 + Math.sin(now * 0.012) * 45 + Math.random() * 25;
          eqBars.forEach((bar) => {
            const h = 2 + Math.random() * 8;
            bar.style.height = h.toFixed(1) + "px";
          });
        }

        const threshold = Math.max(28, averageBass * 1.22);

        if (bass > threshold && now - lastBeatTime > 180) {
          beatPulse = Math.min(1, Math.max(0.45, bass / 120));
          lastBeatTime = now;
          // Shift club neon hue on strong bass hits
          clubHue = (clubHue + 45) % 360;
        }

        averageBass = averageBass * 0.94 + bass * 0.06;
        beatPulse *= 0.88;
        clubHue = (clubHue + 0.6) % 360;

        const beat = beatPulse;
        const scale = 1 + beat * 0.055;
        const shakeX = (Math.random() - 0.5) * beat * 9;
        const shakeY = -beat * 5 + (Math.random() - 0.5) * beat * 5;

        const root = document.documentElement;
        root.style.setProperty("--beat-scale", scale);
        root.style.setProperty("--beat-x", shakeX + "px");
        root.style.setProperty("--beat-y", shakeY + "px");
        root.style.setProperty("--beat-glow", beat);
        root.style.setProperty("--club-hue", clubHue.toFixed(0) + "deg");

        animationId = requestAnimationFrame(animate);
      }

      animate();
    }

    function stopBeatEffect() {
      cancelAnimationFrame(animationId);
      animationId = null;
      beatPulse = 0;

      document.body.classList.remove("audio-reactive");
      eqBars.forEach((bar) => (bar.style.height = "3px"));

      const root = document.documentElement;
      root.style.setProperty("--beat-scale", "1");
      root.style.setProperty("--beat-x", "0px");
      root.style.setProperty("--beat-y", "0px");
      root.style.setProperty("--beat-glow", "0");
    }

    /* =========================================
       8. START APPLICATION
    ========================================= */
    function initialize() {
      createParticles();
      applyVolume(lastSavedVolume);
      loadTrack(currentTrackIndex, false);
      updateCountdown();
      updateCurrentTime();
      setInterval(updateCountdown, 1000);
      setInterval(updateCurrentTime, 1000);
    }

    initialize();
  </script>

</body>
