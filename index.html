<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BACII 2027 — Countdown</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       ROOT & RESET
    ========================================= */
    :root {
      --bg-1: #070b16;
      --bg-2: #101a33;
      --bg-3: #16264a;

      --accent: #4facfe;
      --accent-2: #00f2fe;
      --white: #ffffff;
      --muted: rgba(255, 255, 255, 0.62);

      --glass: rgba(255, 255, 255, 0.065);
      --glass-border: rgba(255, 255, 255, 0.13);

      --beat-scale: 1;
      --beat-x: 0px;
      --beat-y: 0px;
      --beat-glow: 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      overflow-x: hidden;
      font-family: 'Poppins', 'Kantumruy Pro', sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 15% 20%, rgba(79, 172, 254, 0.20), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.13), transparent 30%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
    }

    /* =========================================
       ANIMATED BACKGROUND
    ========================================= */
    body::before {
      content: "";
      position: fixed;
      inset: -50%;
      background: conic-gradient(
        from 0deg,
        transparent,
        rgba(79, 172, 254, 0.08),
        transparent,
        rgba(0, 242, 254, 0.07),
        transparent
      );
      animation: rotateBG 25s linear infinite;
      pointer-events: none;
      z-index: -2;
    }

    @keyframes rotateBG {
      to { transform: rotate(360deg); }
    }

    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(79, 172, 254, 0.8);
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(110vh) scale(0.5);
        opacity: 0;
      }
      10%, 90% { opacity: 1; }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* =========================================
       MAIN CONTAINER
    ========================================= */
    .container {
      position: relative;
      width: min(950px, 100%);
      padding: clamp(25px, 5vw, 60px);
      text-align: center;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.085),
        rgba(255, 255, 255, 0.035)
      );
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow:
        0 35px 100px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
      animation: containerIn 1s ease-out;
    }

    @keyframes containerIn {
      from {
        opacity: 0;
        transform: translateY(35px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =========================================
       HEADER
    ========================================= */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      margin-bottom: 18px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--accent-2);
      background: rgba(0, 242, 254, 0.07);
      border: 1px solid rgba(0, 242, 254, 0.15);
      border-radius: 999px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background: var(--accent-2);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-2);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.5;
        transform: scale(0.8);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    .title {
      font-size: clamp(28px, 6vw, 64px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(
        135deg,
        #ffffff 10%,
        #8fdcff 50%,
        #00f2fe 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: clamp(12px, 2.5vw, 15px);
      font-weight: 400;
      letter-spacing: 0.5px;
      min-height: 24px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.35s ease, color 0.25s ease;
    }

    .subtitle:hover {
      color: #ffffff;
    }

    /* =========================================
       COUNTDOWN
    ========================================= */
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(10px, 2vw, 20px);
      margin-top: clamp(25px, 5vw, 45px);
    }

    .box {
      position: relative;
      min-width: 0;
      padding: clamp(15px, 3vw, 30px) 10px;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.075),
        rgba(0, 0, 0, 0.16)
      );
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 18px;
      overflow: hidden;
      transition:
        transform 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease;
    }

    .box::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--accent-2),
        transparent
      );
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      to { left: 100%; }
    }

    .box:hover {
      transform: translateY(-8px) scale(1.025);
      border-color: rgba(79, 172, 254, 0.35);
      box-shadow: 0 15px 40px rgba(0, 242, 254, 0.10);
    }

    .number {
      display: block;
      font-size: clamp(28px, 6vw, 68px);
      line-height: 1;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: white;
      text-shadow: 0 0 25px rgba(79, 172, 254, 0.35);
    }

    .number.tick {
      animation: numberTick 0.25s ease;
    }

    @keyframes numberTick {
      50% {
        transform: translateY(-4px) scale(1.04);
        text-shadow: 0 0 35px rgba(0, 242, 254, 0.8);
      }
    }

    .label {
      display: block;
      margin-top: 10px;
      color: var(--accent-2);
      font-size: clamp(10px, 1.8vw, 12px);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* =========================================
       PROGRESS SECTION
    ========================================= */
    .progress-section {
      margin-top: clamp(30px, 5vw, 45px);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    #progress-text {
      color: var(--accent-2);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    }

    .progress-track {
      position: relative;
      width: 100%;
      height: 58px;
      display: flex;
      align-items: center;
      --progress: 0%;
    }

    .progress-bar {
      position: relative;
      width: 100%;
      height: 9px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.4);
    }

    .progress-fill {
      position: relative;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        #0756d9,
        #00c8ff,
        #8be9ff
      );
      box-shadow:
        0 0 10px #00c8ff,
        0 0 22px rgba(0, 200, 255, 0.55);
      transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 20%,
        rgba(255, 255, 255, 0.85) 50%,
        transparent 80%
      );
      animation: progressShimmer 2s linear infinite;
    }

    @keyframes progressShimmer {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    /* =========================================
       SASUKE RUNNER + CHAKRA AURA & CHIDORI SVG
    ========================================= */
    .sasuke-runner {
      position: absolute;
      z-index: 5;
      width: 54px;
      height: 54px;
      top: 50%;
      left: clamp(27px, var(--progress), calc(100% - 27px));
      transform: translate(-50%, -50%);
      transition: left 1s cubic-bezier(0.22, 1, 0.36, 1);
      animation: runnerBounce 0.32s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .chakra-svg {
      position: absolute;
      inset: -16px;
      width: calc(100% + 32px);
      height: calc(100% + 32px);
      z-index: 1;
      overflow: visible;
      transform: scale(calc(1 + var(--beat-glow) * 0.32));
      transition: transform 0.08s ease-out;
    }

    .chakra-aura-outer {
      fill: rgba(0, 195, 255, 0.18);
      stroke: #00e1ff;
      stroke-width: 1.5;
      filter: drop-shadow(0 0 8px #00c8ff);
      transform-origin: center;
      animation: chakraPulse 0.65s ease-in-out infinite alternate;
    }

    .chakra-aura-inner {
      fill: rgba(140, 235, 255, 0.25);
      stroke: #ffffff;
      stroke-width: 1;
      transform-origin: center;
      animation: chakraPulseInner 0.45s ease-in-out infinite alternate;
    }

    .chidori-arc {
      fill: none;
      stroke: #b8f4ff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px #00f2fe);
      opacity: 0.85;
    }

    .chidori-arc.arc-1 {
      animation: chidoriFlicker1 0.22s steps(2, end) infinite;
    }

    .chidori-arc.arc-2 {
      animation: chidoriFlicker2 0.18s steps(2, end) infinite;
    }

    .sasuke-img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 calc(6px + var(--beat-glow) * 10px) #00c8ff);
    }

    @keyframes runnerBounce {
      from { margin-top: -3px; }
      to { margin-top: 3px; }
    }

    @keyframes chakraPulse {
      from {
        opacity: 0.45;
        transform: scale(0.92) rotate(-3deg);
      }
      to {
        opacity: 0.95;
        transform: scale(1.08) rotate(3deg);
      }
    }

    @keyframes chakraPulseInner {
      from {
        opacity: 0.35;
        transform: scale(0.88);
      }
      to {
        opacity: 0.85;
        transform: scale(1.04);
      }
    }

    @keyframes chidoriFlicker1 {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 0.15; transform: scale(0.94) rotate(6deg); }
    }

    @keyframes chidoriFlicker2 {
      0%, 100% { opacity: 0.2; transform: scale(0.95) rotate(-5deg); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .chakra-trail {
      position: absolute;
      top: 50%;
      left: 0;
      width: var(--progress);
      height: 4px;
      transform: translateY(-50%);
      pointer-events: none;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(0, 200, 255, 0.35),
        #00f2fe
      );
      filter: blur(2px);
      opacity: 0.9;
    }

    .progress-track.complete .progress-fill {
      background: linear-gradient(
        90deg,
        #00c853,
        #69f0ae,
        #b9f6ca
      );
      box-shadow: 0 0 20px rgba(0, 255, 130, 0.8);
    }

    .progress-track.complete .sasuke-img {
      filter: drop-shadow(0 0 12px #00ff88);
    }

    /* =========================================
       BOTTOM INFORMATION
    ========================================= */
    .info-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 25px;
    }

    .current-time {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .current-time strong {
      color: white;
      font-weight: 500;
    }

    .pills-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .target-date {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
    }

    .target-date strong {
      color: white;
      font-weight: 600;
    }

    .finished {
      grid-column: 1 / -1;
      padding: 40px 10px;
      font-size: clamp(20px, 5vw, 48px);
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: celebration 1s ease-in-out infinite alternate;
    }

    @keyframes celebration {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    /* =========================================
       VIP DYNAMIC ISLAND MUSIC BANNER
    ========================================= */
    .music-banner {
      position: fixed;
      bottom: 22px;
      left: 22px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      padding: 10px 14px;
      overflow: hidden;
      background: linear-gradient(
        135deg,
        rgba(14, 24, 46, 0.90),
        rgba(8, 14, 28, 0.94)
      );
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(0, 210, 255, 0.22);
      border-radius: 999px;
      box-shadow:
        0 14px 36px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.12);
      transition:
        padding 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.35s ease,
        box-shadow 0.35s ease;
      transform: none !important;
    }

    .music-banner:hover,
    .music-banner.volume-visible {
      border-color: rgba(0, 242, 254, 0.45);
      box-shadow:
        0 18px 42px rgba(0, 0, 0, 0.55),
        0 0 22px rgba(0, 210, 255, 0.16),
        inset 0 1px 1px rgba(255, 255, 255, 0.18);
    }

    /* Play Button with VIP Spinning Aura */
    .music-play-btn {
      position: relative;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      color: white;
      background: linear-gradient(135deg, #0768c9, #00d2ff);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 200, 255, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .music-play-btn::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent,
        #00f2fe,
        transparent,
        #4facfe,
        transparent
      );
      opacity: 0;
      z-index: -1;
      transition: opacity 0.35s ease;
    }

    .music-banner.is-playing .music-play-btn::before {
      opacity: 0.85;
      animation: rotateBG 3s linear infinite;
    }

    .music-play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 22px rgba(0, 225, 255, 0.65);
    }

    .music-play-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      display: block;
    }

    /* Track Info */
    .music-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-left: 11px;
      padding-right: 4px;
      white-space: nowrap;
    }

    .music-status-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .music-status {
      color: #00e1ff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.4px;
    }

    /* Mini Audio Equalizer Bars */
    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
      opacity: 0.3;
      transition: opacity 0.25s ease;
    }

    .eq-bars.playing {
      opacity: 1;
    }

    .eq-bar {
      width: 2.5px;
      height: 3px;
      background: #00f2fe;
      border-radius: 2px;
      transition: height 0.08s ease;
    }

    .music-name {
      color: white;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    /* Auto-Collapsing VIP Volume Drawer */
    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;

      /* Collapsed State: Takes 0px width, no empty space */
      max-width: 0;
      opacity: 0;
      margin-left: 0;
      padding-left: 0;
      border-left: 1px solid rgba(255, 255, 255, 0);
      overflow: hidden;
      pointer-events: none;
      transform: translateX(-8px) scale(0.95);

      transition:
        max-width 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.28s ease,
        margin-left 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        padding-left 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.35s ease;
    }

    /* Expanded State on Hover or Active Interaction */
    .music-banner:hover .volume-control,
    .music-banner.volume-visible .volume-control {
      max-width: 165px;
      opacity: 1;
      margin-left: 10px;
      padding-left: 12px;
      border-left: 1px solid rgba(255, 255, 255, 0.14);
      pointer-events: auto;
      transform: translateX(0) scale(1);
    }

    .volume-mute-btn {
      background: none;
      border: none;
      color: #8fdcff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 2px;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .volume-mute-btn:hover {
      color: #00f2fe;
      transform: scale(1.12);
    }

    .volume-mute-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* VIP Custom Glowing Range Slider */
    #volume-wheel {
      --vol-pct: 70%;
      -webkit-appearance: none;
      appearance: none;
      width: 76px;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        #00c8ff 0%,
        #00f2fe var(--vol-pct),
        rgba(255, 255, 255, 0.14) var(--vol-pct),
        rgba(255, 255, 255, 0.14) 100%
      );
      outline: none;
      cursor: pointer;
      transition: box-shadow 0.25s ease;
    }

    #volume-wheel:hover {
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
    }

    #volume-wheel::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #00e1ff;
      box-shadow: 0 0 10px #00f2fe;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    #volume-wheel::-webkit-slider-thumb:hover {
      transform: scale(1.22);
      background: #e0fbff;
    }

    #volume-wheel::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #00e1ff;
      box-shadow: 0 0 10px #00f2fe;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #volume-value {
      color: rgba(255, 255, 255, 0.85);
      font-size: 10.5px;
      font-weight: 600;
      min-width: 28px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Song Progress Line inside Banner */
    .music-progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #087bdb, #00f2fe);
      box-shadow: 0 0 8px #00f2fe;
      transition: width 0.2s linear;
    }

    /* =========================================
       REAL AUDIO REACTIVE EFFECT
    ========================================= */
    body.audio-reactive .container {
      transform: translate3d(
        var(--beat-x),
        var(--beat-y),
        0
      ) scale(var(--beat-scale));
      transition: none !important;
      will-change: transform;
    }

    body.audio-reactive .box {
      box-shadow:
        0 0 calc(var(--beat-glow) * 28px)
        rgba(0, 200, 255, 0.65);
    }

    body.audio-reactive .title {
      filter: drop-shadow(
        0 0 calc(var(--beat-glow) * 18px)
        rgba(0, 200, 255, 0.8)
      );
    }

    /* =========================================
       RESPONSIVE DESIGN & ACCESSIBILITY
    ========================================= */
    @media (max-width: 768px) {
      .countdown {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
    }

    @media (max-width: 480px) {
      body { padding: 15px; }
      .container { padding: 30px 15px; }
      .countdown { gap: 12px; }
      .box { padding: 18px 5px; }
      .number { font-size: 32px; }
      .label {
        font-size: 9px;
        letter-spacing: 1px;
      }
      .music-banner {
        bottom: 14px;
        left: 14px;
        padding: 8px 12px;
        max-width: calc(100vw - 28px);
      }
      .music-name { font-size: 11.5px; }
      .music-banner:hover .volume-control,
      .music-banner.volume-visible .volume-control {
        max-width: 140px;
        margin-left: 8px;
        padding-left: 10px;
      }
      #volume-wheel { width: 58px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Background Particles -->
  <div class="particles" id="particles"></div>

  <!-- Main Container -->
  <main class="container">

    <div class="badge">
      <span class="badge-dot"></span>
      GOOD LUCK
    </div>

    <h1 class="title">BACII 2027</h1>

    <p class="subtitle" id="quote-subtitle" title="ចុចដើម្បីប្ដូរពាក្យលើកទឹកចិត្ត">
      Knowledge is the key to success
    </p>

    <!-- Countdown -->
    <div class="countdown" id="countdown-wrapper">
      <div class="box">
        <span id="days" class="number">00</span>
        <span class="label">Days</span>
      </div>

      <div class="box">
        <span id="hours" class="number">00</span>
        <span class="label">Hours</span>
      </div>

      <div class="box">
        <span id="minutes" class="number">00</span>
        <span class="label">Minutes</span>
      </div>

      <div class="box">
        <span id="seconds" class="number">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-info">
        <span>Journey Progress</span>
        <span id="progress-text">0.00%</span>
      </div>

      <div class="progress-track" id="progress-track">
        <div class="chakra-trail"></div>

        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <!-- Sasuke Runner with SVG Chakra Aura + Chidori -->
        <div class="sasuke-runner" id="sasuke-runner" aria-hidden="true">
          <svg class="chakra-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
            <path class="chakra-aura-outer"
              d="M12 42 L22 35 L15 24 L31 30 L39 10 L46 29
                 L64 20 L56 37 L72 42 L55 48 L65 62 L46 54
                 L39 70 L32 54 L15 61 L23 47 Z" />
            <path class="chakra-aura-inner"
              d="M20 42 L28 36 L24 28 L35 33 L40 19 L45 33
                 L56 27 L51 38 L62 42 L50 47 L56 56 L44 50
                 L39 62 L34 50 L23 55 L28 45 Z" />
            <path class="chidori-arc arc-1"
              d="M8 38 L19 33 L14 26 L26 22 M54 24 L65 19 L59 31 L71 36" />
            <path class="chidori-arc arc-2"
              d="M14 54 L25 49 L21 59 L33 64 M49 56 L61 52 L57 62 L69 58" />
          </svg>

          <img
            src="https://i.ibb.co/nq91Fwpn/sasuke-running.png"
            class="sasuke-img"
            alt="Sasuke Running"
          >
        </div>
      </div>
    </div>

    <!-- Information -->
    <div class="info-container">
      <div class="current-time">
        Cambodia Time (UTC+7):
        <strong id="current-time">Loading...</strong>
      </div>

      <div class="pills-row">
        <div class="target-date">
          📅 Exam Date:
          <strong>10 សីហា 2027</strong>
        </div>

        <div class="target-date">
          🎯 Target:
          <strong>និទ្ទេស C</strong>
        </div>
      </div>
    </div>

  </main>

  <!-- VIP DYNAMIC ISLAND MUSIC BANNER -->
  <div class="music-banner" id="music-banner">
    <audio id="bg-music" preload="none" loop crossorigin="anonymous">
      <source src="https://files.catbox.moe/sy11mk.mp3" type="audio/mpeg">
    </audio>

    <button id="music-button" class="music-play-btn" title="Play / Pause" aria-label="Play or Pause Music">
      <svg id="play-pause-icon" viewBox="0 0 24 24">
        <path d="M8 5.14v14l11-7-11-7z"/>
      </svg>
    </button>

    <div class="music-info" id="music-info-trigger">
      <div class="music-status-row">
        <span class="music-status" id="music-status">READY</span>
        <div class="eq-bars" id="eq-bars">
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
        </div>
      </div>
      <span class="music-name">បទបាក់ឌុប</span>
    </div>

    <div class="volume-control">
      <button id="volume-icon" class="volume-mute-btn" title="Mute / Unmute" aria-label="Mute or Unmute">
        <svg id="volume-svg" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>

      <input
        type="range"
        id="volume-wheel"
        min="0"
        max="100"
        value="70"
        step="1"
        title="Volume"
      >
      <span id="volume-value">70%</span>
    </div>

    <div class="music-progress-bar" id="music-progress-bar"></div>
  </div>

  <!-- =========================================
       JAVASCRIPT
  ========================================= -->
  <script>
    /* =========================================
       SETTINGS & ELEMENTS
    ========================================= */
    const START_DATE = new Date("2026-08-18T00:00:00+07:00").getTime();
    const TARGET_DATE = new Date("2027-08-10T00:00:00+07:00").getTime();

    const daysElement = document.getElementById("days");
    const hoursElement = document.getElementById("hours");
    const minutesElement = document.getElementById("minutes");
    const secondsElement = document.getElementById("seconds");

    const progressFill = document.getElementById("progress-fill");
    const progressText = document.getElementById("progress-text");
    const progressTrack = document.getElementById("progress-track");

    const currentTimeElement = document.getElementById("current-time");
    const countdownWrapper = document.getElementById("countdown-wrapper");
    const quoteSubtitle = document.getElementById("quote-subtitle");

    /* =========================================
       MOTIVATIONAL QUOTES ROTATOR
    ========================================= */
    const QUOTES = [
      "Knowledge is the key to success",
      "ការខិតខំថ្ងៃនេះ គឺជាផ្លែផ្កាថ្ងៃស្អែក — ឆ្ពោះទៅរកបាក់ឌុប ២០២៧",
      "Every hour of study brings you closer to your goal",
      "កុំបោះបង់! ការនឿយហត់ពេលនេះ នឹងប្ដូរមកវិញនូវស្នាមញញឹមថ្ងៃប្រកាសលទ្ធផល",
      "Discipline beats motivation — Stay focused!"
    ];
    let quoteIndex = 0;

    function cycleQuote() {
      quoteSubtitle.style.opacity = "0";
      setTimeout(() => {
        quoteIndex = (quoteIndex + 1) % QUOTES.length;
        quoteSubtitle.textContent = QUOTES[quoteIndex];
        quoteSubtitle.style.opacity = "1";
      }, 300);
    }

    quoteSubtitle.addEventListener("click", cycleQuote);
    setInterval(cycleQuote, 8000);

    /* =========================================
       HELPER FUNCTIONS
    ========================================= */
    function pad(number) {
      return String(number).padStart(2, "0");
    }

    function updateNumber(element, value) {
      if (!element) return;
      const formatted = pad(value);
      if (element.textContent !== formatted) {
        element.textContent = formatted;
        element.classList.remove("tick");
        void element.offsetWidth;
        element.classList.add("tick");
      }
    }

    /* =========================================
       CAMBODIA CLOCK
    ========================================= */
    function updateCurrentTime() {
      const now = new Date();
      const cambodiaTime = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Phnom_Penh",
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(now);

      currentTimeElement.textContent = cambodiaTime;
    }

    /* =========================================
       PROGRESS & COUNTDOWN
    ========================================= */
    function updateProgress(now) {
      const totalDuration = TARGET_DATE - START_DATE;
      const elapsed = now - START_DATE;
      let progress = (elapsed / totalDuration) * 100;
      progress = Math.max(0, Math.min(100, progress));

      const percentage = progress.toFixed(2) + "%";
      progressFill.style.width = percentage;
      progressText.textContent = percentage;
      progressTrack.style.setProperty("--progress", progress + "%");
      progressTrack.classList.toggle("complete", progress >= 100);
    }

    function updateCountdown() {
      const now = Date.now();
      const difference = TARGET_DATE - now;

      updateProgress(now);

      if (difference <= 0) {
        countdownWrapper.innerHTML = `
          <div class="finished">
            🎉 The Day Has Arrived!
          </div>
        `;
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
      );
      const minutes = Math.floor(
        (difference % (1000 * 60 * 60)) / (1000 * 60)
      );
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      updateNumber(daysElement, days);
      updateNumber(hoursElement, hours);
      updateNumber(minutesElement, minutes);
      updateNumber(secondsElement, seconds);
    }

    /* =========================================
       BACKGROUND PARTICLES
    ========================================= */
    function createParticles() {
      const container = document.getElementById("particles");
      const amount = window.innerWidth < 600 ? 25 : 45;

      for (let i = 0; i < amount; i++) {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.animationDuration = (8 + Math.random() * 15) + "s";
        particle.style.animationDelay = Math.random() * 15 + "s";

        const size = 1 + Math.random() * 3;
        particle.style.width = size + "px";
        particle.style.height = size + "px";

        container.appendChild(particle);
      }
    }

    function initialize() {
      createParticles();
      updateCountdown();
      updateCurrentTime();
      setInterval(updateCountdown, 1000);
      setInterval(updateCurrentTime, 1000);
    }

    initialize();

    /* =========================================
       VIP MUSIC PLAYER + AUTO-COLLAPSE DRAWER
    ========================================= */
    const music = document.getElementById("bg-music");
    const musicBanner = document.getElementById("music-banner");
    const musicButton = document.getElementById("music-button");
    const playPauseIcon = document.getElementById("play-pause-icon");
    const musicInfoTrigger = document.getElementById("music-info-trigger");
    const musicStatus = document.getElementById("music-status");
    const musicProgressBar = document.getElementById("music-progress-bar");
    const eqBarsContainer = document.getElementById("eq-bars");
    const eqBars = document.querySelectorAll(".eq-bar");

    const volumeWheel = document.getElementById("volume-wheel");
    const volumeValue = document.getElementById("volume-value");
    const volumeIcon = document.getElementById("volume-icon");
    const volumeSvg = document.getElementById("volume-svg");

    const ICON_PLAY = '<path d="M8 5.14v14l11-7-11-7z"/>';
    const ICON_PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    const ICON_VOL_HIGH = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    const ICON_VOL_LOW = '<path d="M7 9v6h4l5 5V4l-5 5H7zm11.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
    const ICON_VOL_MUTE = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';

    let audioContext = null;
    let analyser = null;
    let source = null;
    let frequencyData = null;
    let useSimulatedBeat = false;

    let animationId = null;
    let beatPulse = 0;
    let averageBass = 0;
    let lastBeatTime = 0;
    let volumeTimeout = null;
    let isPointerInside = false;
    let lastSavedVolume = Number(localStorage.getItem("bacii_volume") ?? 70);

    function applyVolume(vol) {
      music.volume = vol / 100;
      volumeWheel.value = vol;
      volumeWheel.style.setProperty("--vol-pct", vol + "%");
      volumeValue.textContent = vol + "%";

      if (vol === 0) volumeSvg.innerHTML = ICON_VOL_MUTE;
      else if (vol <= 50) volumeSvg.innerHTML = ICON_VOL_LOW;
      else volumeSvg.innerHTML = ICON_VOL_HIGH;

      localStorage.setItem("bacii_volume", String(vol));
    }

    applyVolume(lastSavedVolume);

    function showVolume(duration = 2200) {
      musicBanner.classList.add("volume-visible");
      clearTimeout(volumeTimeout);
      if (!isPointerInside) {
        volumeTimeout = setTimeout(() => {
          musicBanner.classList.remove("volume-visible");
        }, duration);
      }
    }

    musicBanner.addEventListener("mouseenter", () => {
      isPointerInside = true;
      clearTimeout(volumeTimeout);
      musicBanner.classList.add("volume-visible");
    });

    musicBanner.addEventListener("mouseleave", () => {
      isPointerInside = false;
      showVolume(1400);
    });

    musicInfoTrigger.addEventListener("click", () => {
      showVolume(2800);
    });

    function setupAudioAnalyzer() {
      if (audioContext || useSimulatedBeat) return;
      try {
        audioContext = new (
          window.AudioContext || window.webkitAudioContext
        )();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.25;

        source = audioContext.createMediaElementSource(music);
        source.connect(analyser);
        analyser.connect(audioContext.destination);

        frequencyData = new Uint8Array(analyser.frequencyBinCount);
      } catch (err) {
        console.warn("Web Audio Analyzer fallback enabled:", err);
        useSimulatedBeat = true;
      }
    }

    async function toggleMusic() {
      showVolume(2600);

      if (music.paused) {
        try {
          setupAudioAnalyzer();
          if (audioContext && audioContext.state === "suspended") {
            await audioContext.resume();
          }

          await music.play();
          setPlayingUI(true);
        } catch (error) {
          console.warn("Retrying audio without CORS restriction...", error);
          useSimulatedBeat = true;
          music.removeAttribute("crossorigin");
          music.load();
          try {
            await music.play();
            setPlayingUI(true);
          } catch (finalError) {
            console.error("Music Error:", finalError);
            setPlayingUI(false);
          }
        }
      } else {
        music.pause();
        setPlayingUI(false);
      }
    }

    function setPlayingUI(isPlaying) {
      if (isPlaying) {
        playPauseIcon.innerHTML = ICON_PAUSE;
        musicStatus.textContent = "NOW PLAYING";
        musicBanner.classList.add("is-playing");
        eqBarsContainer.classList.add("playing");
        document.body.classList.add("audio-reactive");
        startBeatEffect();
      } else {
        playPauseIcon.innerHTML = ICON_PLAY;
        musicStatus.textContent = "PAUSED";
        musicBanner.classList.remove("is-playing");
        eqBarsContainer.classList.remove("playing");
        stopBeatEffect();
      }
    }

    musicButton.addEventListener("click", toggleMusic);

    /* VOLUME & MUTE CONTROLS */
    volumeWheel.addEventListener("input", () => {
      const volume = Number(volumeWheel.value);
      if (volume > 0) lastSavedVolume = volume;
      applyVolume(volume);
      showVolume(2500);
    });

    volumeIcon.addEventListener("click", () => {
      if (music.volume > 0) {
        applyVolume(0);
      } else {
        applyVolume(lastSavedVolume || 70);
      }
      showVolume(2500);
    });

    /* SONG TIME PROGRESS */
    music.addEventListener("timeupdate", () => {
      if (music.duration) {
        const pct = (music.currentTime / music.duration) * 100;
        musicProgressBar.style.width = pct.toFixed(1) + "%";
      }
    });

    /* REAL-TIME BASS DETECTION + EQUALIZER */
    function startBeatEffect() {
      cancelAnimationFrame(animationId);
      beatPulse = 0;
      averageBass = 0;
      lastBeatTime = 0;

      function animate() {
        if (music.paused) return;

        const now = performance.now();
        let bass = 0;

        if (!useSimulatedBeat && analyser && frequencyData) {
          analyser.getByteFrequencyData(frequencyData);

          const binHz = audioContext.sampleRate / analyser.fftSize;
          const startBin = Math.max(1, Math.floor(35 / binHz));
          const endBin = Math.min(
            frequencyData.length - 1,
            Math.ceil(150 / binHz)
          );

          let count = 0;
          for (let i = startBin; i <= endBin; i++) {
            bass += frequencyData[i];
            count++;
          }
          bass = count ? bass / count : 0;

          const step = Math.floor(endBin / 4) || 1;
          eqBars.forEach((bar, idx) => {
            const val = frequencyData[startBin + idx * step] || 0;
            const h = Math.max(2, (val / 255) * 10);
            bar.style.height = h.toFixed(1) + "px";
          });
        } else {
          bass = 65 + Math.sin(now * 0.012) * 45 + Math.random() * 25;
          eqBars.forEach((bar) => {
            const h = 2 + Math.random() * 8;
            bar.style.height = h.toFixed(1) + "px";
          });
        }

        const threshold = Math.max(28, averageBass * 1.22);

        if (bass > threshold && now - lastBeatTime > 180) {
          beatPulse = Math.min(1, Math.max(0.45, bass / 120));
          lastBeatTime = now;
        }

        averageBass = averageBass * 0.94 + bass * 0.06;
        beatPulse *= 0.88;

        const beat = beatPulse;
        const scale = 1 + beat * 0.055;
        const shakeX = (Math.random() - 0.5) * beat * 9;
        const shakeY = -beat * 5 + (Math.random() - 0.5) * beat * 5;

        const root = document.documentElement;
        root.style.setProperty("--beat-scale", scale);
        root.style.setProperty("--beat-x", shakeX + "px");
        root.style.setProperty("--beat-y", shakeY + "px");
        root.style.setProperty("--beat-glow", beat);

        animationId = requestAnimationFrame(animate);
      }

      animate();
    }

    function stopBeatEffect() {
      cancelAnimationFrame(animationId);
      animationId = null;
      beatPulse = 0;

      document.body.classList.remove("audio-reactive");
      eqBars.forEach((bar) => (bar.style.height = "3px"));

      const root = document.documentElement;
      root.style.setProperty("--beat-scale", "1");
      root.style.setProperty("--beat-x", "0px");
      root.style.setProperty("--beat-y", "0px");
      root.style.setProperty("--beat-glow", "0");
    }
  </script>

</body>
