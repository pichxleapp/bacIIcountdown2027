<!DOCTYPE html>

<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BACII 2027 — Ultimate Study Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       ROOT & RESET
    ========================================= */
    :root {
      --bg-1: #060913; --bg-2: #0f1830; --bg-3: #152345;
      --accent: #4facfe; --accent-2: #00f2fe; --white: #ffffff; --muted: rgba(255, 255, 255, 0.62);
      --glass: rgba(255, 255, 255, 0.065); --glass-border: rgba(255, 255, 255, 0.13);
      --beat-scale: 1; --beat-x: 0px; --beat-y: 0px; --beat-glow: 0; --club-hue: 190deg;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 25px;
      font-family: 'Poppins', 'Kantumruy Pro', sans-serif; color: var(--white);
      background: radial-gradient(circle at 15% 20%, rgba(79, 172, 254, 0.18), transparent 30%),
                  radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.12), transparent 30%),
                  linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      transition: background 0.8s ease;
    }
    /* ZEN MODE COLOR SHIFT */
    body.zen-mode-on {
      --bg-1: #1a1005; --bg-2: #2d1a08; --bg-3: #40240a; --accent-2: #ffb703;
    }
    
    /* =========================================
       BACKGROUNDS (PARTICLES, RAIN, CLUB, SPECTRUM)
    ========================================= */
    .bg-rotator { position: fixed; inset: 0; z-index: -4; contain: strict; transition: filter 0.8s; }
    body.zen-mode-on .bg-rotator { filter: sepia(40%) hue-rotate(-20deg); }
    .bg-rotator::before {
      content: ""; position: absolute; inset: -50%;
      background: conic-gradient(from 0deg, transparent, rgba(79, 172, 254, 0.08), transparent, rgba(0, 242, 254, 0.07), transparent);
      animation: rotateBG 25s linear infinite; will-change: transform;
    }
    @keyframes rotateBG { to { transform: rotate3d(0, 0, 1, 360deg); } }
    
    .particles { position: fixed; inset: 0; z-index: -3; contain: strict; transition: opacity 0.5s; }
    body.zen-mode-on .particles { opacity: 0; }
    
    #rain-canvas { position: fixed; inset: 0; z-index: -3; pointer-events: none; opacity: 0; transition: opacity 1s; }
    body.zen-mode-on #rain-canvas { opacity: 1; }
    
    #spectrum-canvas { position: fixed; bottom: 0; left: 0; width: 100%; height: 35vh; z-index: -2; opacity: 0.6; pointer-events: none; }
    
    .club-lights { position: fixed; inset: 0; z-index: -2; opacity: 0; transition: opacity 0.45s ease; pointer-events: none; }
    body.club-mode-on .club-lights { opacity: 1; }
    
    /* Simplified Spotlights for code space */
    .spotlight { position: absolute; top: -15%; width: 70vw; height: 130vh; transform-origin: 50% 0%; will-change: transform; }
    .spotlight-1 { left: -10vw; background: conic-gradient(from 162deg at 50% 0%, transparent 0deg, rgba(0, 242, 254, 0.2) 18deg, transparent 36deg); animation: sweep 4.2s ease-in-out infinite alternate; }
    .spotlight-2 { right: -10vw; background: conic-gradient(from 162deg at 50% 0%, transparent 0deg, rgba(255, 0, 128, 0.2) 18deg, transparent 36deg); animation: sweep 3.6s ease-in-out infinite alternate-reverse; }
    @keyframes sweep { from { transform: rotate3d(0,0,1, -25deg); } to { transform: rotate3d(0,0,1, 25deg); } }
    
    /* =========================================
       MAIN CONTAINER
    ========================================= */
    .container {
      position: relative; width: min(950px, 100%); padding: clamp(25px, 5vw, 60px); text-align: center;
      background: linear-gradient(135deg, rgba(14, 22, 42, 0.78), rgba(8, 14, 28, 0.65));
      border: 1px solid var(--glass-border); border-radius: 28px;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.08);
      z-index: 1; transition: transform 0.1s, background 0.8s, border-color 0.8s;
    }
    body.zen-mode-on .container { background: linear-gradient(135deg, rgba(42, 25, 14, 0.78), rgba(28, 16, 8, 0.65)); border-color: rgba(255, 183, 3, 0.2); }
    
    body.audio-reactive:not(.zen-mode-on) .container {
      transform: translate3d(var(--beat-x), var(--beat-y), 0) scale3d(var(--beat-scale), var(--beat-scale), 1);
    }
    .container::after {
      content: ""; position: absolute; inset: -2px; border-radius: 30px; z-index: -1; pointer-events: none;
      border: 1.5px solid hsla(var(--club-hue), 100%, 65%, 0.75); box-shadow: 0 0 38px hsla(var(--club-hue), 100%, 60%, 0.55);
      opacity: 0; transition: opacity 0.1s;
    }
    body.audio-reactive.club-mode-on .container::after { opacity: var(--beat-glow); }


    /* Text & Countdown Box styles */
    .title { font-size: clamp(28px, 6vw, 64px); font-weight: 800; background: linear-gradient(135deg, #fff, #8fdcff, var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { margin-top: 12px; color: var(--muted); font-size: clamp(12px, 2.5vw, 15px); cursor: pointer; }
    
    .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(10px, 2vw, 20px); margin-top: 30px; }
    .box { padding: clamp(15px, 3vw, 30px) 10px; background: linear-gradient(145deg, rgba(255,255,255,0.075), rgba(0,0,0,0.16)); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; position: relative; overflow: hidden; }
    .box::before { content: ""; position: absolute; top:0; left:0; width:100%; height:1px; background: linear-gradient(90deg, transparent, var(--accent-2), transparent); transform: translateX(-100%); animation: shine 4s infinite; }
    @keyframes shine { to { transform: translateX(100%); } }
    .number { font-size: clamp(28px, 6vw, 68px); font-weight: 700; color: white; text-shadow: 0 0 20px rgba(79, 172, 254, 0.35); display: block; }
    .label { font-size: clamp(10px, 1.8vw, 12px); font-weight: 600; color: var(--accent-2); letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; display: block; }
    
    /* Progress */
    .progress-section { margin-top: 35px; }
    .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .progress-track { position: relative; height: 50px; display: flex; align-items: center; --progress: 0%; }
    .progress-bar { width: 100%; height: 9px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #0756d9, var(--accent-2)); transition: width 1s ease; }
    .sasuke-runner { position: absolute; width: 48px; height: 48px; left: clamp(24px, var(--progress), calc(100% - 24px)); transform: translate(-50%, -50%); transition: left 1s ease; animation: bounce 0.3s infinite alternate; }
    .sasuke-img { width: 100%; filter: drop-shadow(0 0 6px var(--accent-2)); }
    @keyframes bounce { to { transform: translate(-50%, calc(-50% + 4px)); } }
    
    .info-container { margin-top: 25px; display: flex; flex-direction: column; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
    .pills-row { display: flex; gap: 10px; }
    .target-date { padding: 6px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; }


    /* =========================================
       WIDGETS: POMODORO & TODO LIST
    ========================================= */
    .floating-btn {
      position: fixed; width: 45px; height: 45px; border-radius: 50%; background: rgba(14,24,46,0.8);
      border: 1px solid rgba(255,255,255,0.15); color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; backdrop-filter: blur(10px); z-index: 100; transition: transform 0.2s, background 0.2s;
    }
    .floating-btn:hover { transform: scale(1.1); background: rgba(0, 242, 254, 0.2); }
    #pomo-toggle { top: 25px; left: 25px; }
    #todo-toggle { top: 25px; right: 25px; }


    .widget-panel {
      position: fixed; top: 80px; background: rgba(10,18,35,0.95); backdrop-filter: blur(15px);
      border: 1px solid rgba(0, 210, 255, 0.2); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 15px; z-index: 99; opacity: 0; pointer-events: none; transition: all 0.3s ease;
    }
    
    /* Pomodoro */
    #pomo-panel { left: 25px; transform: translateX(-20px); width: 220px; text-align: center; }
    #pomo-panel.open { opacity: 1; pointer-events: auto; transform: translateX(0); }
    .pomo-time { font-size: 36px; font-weight: 700; color: var(--accent-2); font-variant-numeric: tabular-nums; line-height: 1; margin: 10px 0; }
    .pomo-status { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .pomo-controls { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
    .pomo-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-family: inherit; }
    .pomo-btn:hover { background: var(--accent); }


    /* Todo Checklist */
    #todo-panel { right: 25px; transform: translateX(20px); width: 280px; max-height: 60vh; display: flex; flex-direction: column; }
    #todo-panel.open { opacity: 1; pointer-events: auto; transform: translateX(0); }
    .todo-header { font-size: 13px; font-weight: 600; color: var(--accent-2); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .todo-input-grp { display: flex; gap: 5px; margin-bottom: 10px; }
    #todo-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 10px; border-radius: 6px; font-family: inherit; font-size: 12px; outline: none; }
    #todo-add { background: var(--accent); border: none; color: white; width: 30px; border-radius: 6px; cursor: pointer; }
    .todo-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .todo-item { display: flex; align-items: center; gap: 8px; font-size: 12px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; cursor: pointer; }
    .todo-item.done span { text-decoration: line-through; color: var(--muted); }
    .todo-checkbox { width: 14px; height: 14px; border: 1px solid var(--accent-2); border-radius: 3px; display: flex; align-items: center; justify-content: center; }
    .todo-item.done .todo-checkbox { background: var(--accent-2); }
    .todo-delete { margin-left: auto; color: #ff4d4d; background: none; border: none; cursor: pointer; font-size: 14px; }


    /* =========================================
       MUSIC BANNER & CONTROLS (Bottom)
    ========================================= */
    .music-wrapper { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 90%; max-width: 450px; }
    .music-banner {
      display: flex; align-items: center; width: 100%; padding: 10px 15px; background: linear-gradient(135deg, rgba(14,24,46,0.92), rgba(8,14,28,0.96));
      backdrop-filter: blur(18px); border: 1px solid rgba(0,210,255,0.2); border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); justify-content: space-between;
    }
    .music-controls { display: flex; align-items: center; gap: 8px; }
    .music-play-btn { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #0768c9, #00d2ff); border: none; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 10px rgba(0,200,255,0.4); }
    .nav-track-btn { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .music-info { flex: 1; margin: 0 10px; overflow: hidden; white-space: nowrap; cursor: pointer; }
    .music-name { font-size: 12px; font-weight: 600; display: block; text-overflow: ellipsis; overflow: hidden; }
    .music-status { font-size: 9px; color: var(--accent-2); }
    .action-toggles { display: flex; gap: 5px; }
    .mode-btn { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .mode-btn.active { background: rgba(0,242,254,0.2); box-shadow: 0 0 8px var(--accent-2); border: 1px solid var(--accent-2); }
    
    .playlist-drawer {
      width: 100%; max-height: 0; opacity: 0; overflow: hidden; transition: 0.3s;
      background: rgba(10,18,35,0.95); backdrop-filter: blur(15px); border-radius: 16px; border: 1px solid transparent;
    }
    .playlist-drawer.open { max-height: 250px; opacity: 1; border-color: rgba(0,210,255,0.2); padding: 10px; margin-bottom: 5px; }
    .playlist-item { font-size: 12px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 6px; margin-bottom: 5px; cursor: pointer; display: flex; justify-content: space-between; }
    .playlist-item.active { background: rgba(0,242,254,0.2); border: 1px solid var(--accent-2); }


    @media (max-width: 768px) {
      .countdown { grid-template-columns: repeat(2, 1fr); }
      #pomo-panel { left: 10px; width: 180px; }
      #todo-panel { right: 10px; width: 220px; }
    }
  </style>

</head>
<body class="club-mode-on">

  <!-- BACKGROUNDS & CANVAS -->

  <div class="bg-rotator"></div>
  <canvas id="rain-canvas"></canvas>

  <div class="club-lights">
    <div class="spotlight spotlight-1"></div>
    <div class="spotlight spotlight-2"></div>
  </div>

  <div class="particles" id="particles"></div>
  <canvas id="spectrum-canvas"></canvas>

  <!-- WIDGETS -->

<button id="pomo-toggle" class="floating-btn" title="Pomodoro Timer">🍅</button>
  <div id="pomo-panel" class="widget-panel">
    <div class="pomo-status" id="pomo-status">Focus Time</div>
    <div class="pomo-time" id="pomo-time">25:00</div>
    <div class="pomo-controls">
      <button class="pomo-btn" id="pomo-start">Start</button>
      <button class="pomo-btn" id="pomo-reset">Reset</button>
    </div>
  </div>

<button id="todo-toggle" class="floating-btn" title="Daily Target">📝</button>
  <div id="todo-panel" class="widget-panel">
    <div class="todo-header"><span>Daily Targets</span> <span id="todo-count">0/0</span></div>
    <div class="todo-input-grp">
      <input type="text" id="todo-input" placeholder="Add new task..." autocomplete="off">
      <button id="todo-add">+</button>
    </div>
    <div class="todo-list" id="todo-list"></div>
  </div>

  <!-- MAIN COUNTDOWN -->

  <main class="container">
    <div class="badge">GOOD LUCK</div>
    <h1 class="title">BACII 2027</h1>
    <p class="subtitle" id="quote-subtitle">Knowledge is the key to success</p>

<div class="countdown" id="countdown-wrapper">
  <div class="box"><span id="days" class="number">00</span><span class="label">Days</span></div>
  <div class="box"><span id="hours" class="number">00</span><span class="label">Hours</span></div>
  <div class="box"><span id="minutes" class="number">00</span><span class="label">Minutes</span></div>
  <div class="box"><span id="seconds" class="number">00</span><span class="label">Seconds</span></div>
</div>

<div class="progress-section">
  <div class="progress-info"><span>Journey Progress</span><span id="progress-text">0.00%</span></div>
  <div class="progress-track" id="progress-track">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="sasuke-runner" id="sasuke-runner">
      <img src="https://i.ibb.co/nq91Fwpn/sasuke-running.png" class="sasuke-img" alt="Runner">
    </div>
  </div>
</div>

<div class="info-container">
  <div class="current-time">Time: <strong id="current-time">...</strong></div>
  <div class="pills-row">
    <div class="target-date">📅 <strong>10 សីហា 2027</strong></div>
    <div class="target-date">🎯 <strong>និទ្ទេស C</strong></div>
  </div>
</div>
  </main>

  <!-- BOTTOM MUSIC & CONTROLS -->

  <div class="music-wrapper">
    <div class="playlist-drawer" id="playlist-drawer">
      <div style="display:flex; justify-content:space-between; margin-bottom: 8px; font-size:11px; color:#00f2fe;">
        <b>PLAYLIST</b> 
        <button id="add-local-btn" style="background:none; border:1px solid #00f2fe; color:#00f2fe; border-radius:4px; font-size:9px; cursor:pointer;">+ Add File</button>
        <input type="file" id="local-audio" accept="audio/*" hidden>
      </div>
      <div id="playlist-tracks" style="overflow-y:auto; max-height: 180px;"></div>
    </div>

<div class="music-banner">
  <audio id="bg-music" preload="auto" crossorigin="anonymous"></audio>
  <div class="music-controls">
    <button class="nav-track-btn" id="btn-prev">⏮</button>
    <button class="music-play-btn" id="btn-play">▶</button>
    <button class="nav-track-btn" id="btn-next">⏭</button>
  </div>
  
  <div class="music-info" id="music-info">
    <span class="music-status" id="music-status">READY</span>
    <span class="music-name" id="music-name">បទបាក់ឌុប</span>
  </div>
  
  <div class="action-toggles">
    <button class="mode-btn active" id="toggle-club" title="Club Mode">🪩</button>
    <button class="mode-btn" id="toggle-zen" title="Zen/Lo-Fi Mode">🧘‍♂️</button>
    <button class="mode-btn" id="toggle-playlist" title="Playlist">🎵</button>
  </div>
</div>
  </div>

  <script>
    /* =========================================
       1. CORE CONFIG & UTILS
    ========================================= */
    const START_DATE = new Date("2026-08-18T00:00:00+07:00").getTime();
    const TARGET_DATE = new Date("2027-08-10T00:00:00+07:00").getTime();
    
    function pad(n) { return String(n).padStart(2, "0"); }
    function setText(id, val) { document.getElementById(id).textContent = val; }
    
    // Updates UI
    function updateCore() {
      const now = Date.now();
      const diff = TARGET_DATE - now;
      const total = TARGET_DATE - START_DATE;
      const prog = Math.max(0, Math.min(100, ((now - START_DATE) / total) * 100));
      
      if(diff > 0) {
        setText('days', pad(Math.floor(diff / 86400000)));
        setText('hours', pad(Math.floor((diff % 86400000) / 3600000)));
        setText('minutes', pad(Math.floor((diff % 3600000) / 60000)));
        setText('seconds', pad(Math.floor((diff % 60000) / 1000)));
      }
      
      document.getElementById('progress-fill').style.width = prog + "%";
      document.getElementById('progress-track').style.setProperty('--progress', prog + "%");
      setText('progress-text', prog.toFixed(2) + "%");
      
      setText('current-time', new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Phnom_Penh", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).format(new Date()));
    }
    setInterval(updateCore, 1000); updateCore();


    /* =========================================
       2. WIDGETS: POMODORO & TODO
    ========================================= */
    // Toggles
    const togglePanel = (btnId, panelId) => {
      document.getElementById(btnId).addEventListener('click', () => {
        document.getElementById(panelId).classList.toggle('open');
      });
    };
    togglePanel('pomo-toggle', 'pomo-panel');
    togglePanel('todo-toggle', 'todo-panel');


    // Pomodoro Logic
    let pomoTime = 25 * 60; let pomoTimer = null; let isPomoWork = true;
    const pomoDisplay = document.getElementById('pomo-time');
    const pomoStatus = document.getElementById('pomo-status');
    const pomoStartBtn = document.getElementById('pomo-start');
    
    function updatePomoUI() {
      pomoDisplay.textContent = `${pad(Math.floor(pomoTime/60))}:${pad(pomoTime%60)}`;
    }
    pomoStartBtn.addEventListener('click', () => {
      if(pomoTimer) { clearInterval(pomoTimer); pomoTimer = null; pomoStartBtn.textContent = 'Start'; }
      else {
        pomoStartBtn.textContent = 'Pause';
        pomoTimer = setInterval(() => {
          pomoTime--; updatePomoUI();
          if(pomoTime <= 0) {
            clearInterval(pomoTimer); pomoTimer = null; pomoStartBtn.textContent = 'Start';
            isPomoWork = !isPomoWork;
            pomoTime = isPomoWork ? 25*60 : 5*60;
            pomoStatus.textContent = isPomoWork ? 'Focus Time' : 'Break Time';
            updatePomoUI();
            alert(isPomoWork ? "Break is over! Back to study." : "Good job! Take a 5 minute break.");
          }
        }, 1000);
      }
    });
    document.getElementById('pomo-reset').addEventListener('click', () => {
      clearInterval(pomoTimer); pomoTimer = null; isPomoWork = true; pomoTime = 25*60;
      pomoStartBtn.textContent = 'Start'; pomoStatus.textContent = 'Focus Time'; updatePomoUI();
    });


    // Todo Logic
    const todoListEl = document.getElementById('todo-list');
    const todoInput = document.getElementById('todo-input');
    let todos = JSON.parse(localStorage.getItem('bacii_todos')) || [];
    
    function renderTodos() {
      todoListEl.innerHTML = '';
      let done = 0;
      todos.forEach((t, i) => {
        if(t.done) done++;
        const el = document.createElement('div');
        el.className = `todo-item ${t.done ? 'done' : ''}`;
        el.innerHTML = `<div class="todo-checkbox">${t.done ? '✓' : ''}</div> <span>${t.text}</span> <button class="todo-delete" data-i="${i}">×</button>`;
        el.addEventListener('click', (e) => {
          if(e.target.classList.contains('todo-delete')) { todos.splice(i, 1); }
          else { t.done = !t.done; }
          saveTodos();
        });
        todoListEl.appendChild(el);
      });
      setText('todo-count', `${done}/${todos.length}`);
    }
    function saveTodos() { localStorage.setItem('bacii_todos', JSON.stringify(todos)); renderTodos(); }
    document.getElementById('todo-add').addEventListener('click', () => {
      if(todoInput.value.trim()) { todos.push({text: todoInput.value.trim(), done: false}); todoInput.value = ''; saveTodos(); }
    });
    todoInput.addEventListener('keypress', e => { if(e.key === 'Enter') document.getElementById('todo-add').click(); });
    renderTodos();


    /* =========================================
       3. MODES: ZEN (RAIN) & CLUB
    ========================================= */
    let isZenMode = false;
    const bodyEl = document.body;
    const clubToggle = document.getElementById('toggle-club');
    const zenToggle = document.getElementById('toggle-zen');
    
    clubToggle.addEventListener('click', () => {
      if(isZenMode) { zenToggle.click(); }
      bodyEl.classList.toggle('club-mode-on');
      clubToggle.classList.toggle('active');
    });
    zenToggle.addEventListener('click', () => {
      isZenMode = !isZenMode;
      bodyEl.classList.toggle('zen-mode-on', isZenMode);
      zenToggle.classList.toggle('active', isZenMode);
      if(isZenMode) {
        bodyEl.classList.remove('club-mode-on'); clubToggle.classList.remove('active');
      }
    });


    // Rain Canvas Logic
    const rCanvas = document.getElementById('rain-canvas');
    const rCtx = rCanvas.getContext('2d');
    let raindrops = [];
    function resizeRain() { rCanvas.width = window.innerWidth; rCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeRain); resizeRain();
    for(let i=0; i<100; i++) { raindrops.push({ x: Math.random()*rCanvas.width, y: Math.random()*rCanvas.height, l: Math.random()*20+10, v: Math.random()*10+5 }); }
    
    /* =========================================
       4. AUDIO & 60FPS VISUALIZER (CANVAS)
    ========================================= */
    const PLAYLIST = [
      { title: "បទបាក់ឌុប (BACII Anthem)", src: "https://files.catbox.moe/sy11mk.mp3" },
      { title: "Lo-Fi Study Chill", src: "https://cdn.jsdelivr.net/gh/captbaritone/webamp@43434d82/mp3/llama-2.91.mp3" }
    ];
    let currTrack = 0; let music = document.getElementById('bg-music'); let isPlaying = false;
    let actx, src, analyser, dataArr; let useSimul = false; let clubHue = 190; let beatPulse = 0, avgBass = 0;


    const sCanvas = document.getElementById('spectrum-canvas');
    const sCtx = sCanvas.getContext('2d');
    function resizeSpec() { sCanvas.width = window.innerWidth; sCanvas.height = window.innerHeight * 0.35; }
    window.addEventListener('resize', resizeSpec); resizeSpec();


    function initAudio() {
      if(actx || useSimul) return;
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = actx.createAnalyser(); analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.8;
        src = actx.createMediaElementSource(music); src.connect(analyser); analyser.connect(actx.destination);
        dataArr = new Uint8Array(analyser.frequencyBinCount);
      } catch(e) { useSimul = true; }
    }


    function loadTrack(idx) {
      if(idx >= PLAYLIST.length) idx = 0; if(idx < 0) idx = PLAYLIST.length-1;
      currTrack = idx; music.src = PLAYLIST[idx].src; music.crossOrigin = "anonymous";
      setText('music-name', PLAYLIST[idx].title); renderPlaylist();
      if(isPlaying) { music.play().catch(()=>{ useSimul=true; music.removeAttribute("crossorigin"); music.play(); }); }
    }


    document.getElementById('btn-play').addEventListener('click', () => {
      initAudio(); if(actx && actx.state === 'suspended') actx.resume();
      if(music.paused) { music.play().then(()=> { isPlaying=true; document.getElementById('btn-play').textContent = 'Ⅱ'; setText('music-status','PLAYING'); bodyEl.classList.add('audio-reactive'); loop(); }).catch(()=>{ useSimul=true; music.removeAttribute("crossorigin"); music.play(); }); }
      else { music.pause(); isPlaying=false; document.getElementById('btn-play').textContent = '▶'; setText('music-status','PAUSED'); bodyEl.classList.remove('audio-reactive'); }
    });
    
    document.getElementById('btn-next').addEventListener('click', () => { loadTrack(currTrack+1); });
    document.getElementById('btn-prev').addEventListener('click', () => { loadTrack(currTrack-1); });
    music.addEventListener('ended', () => loadTrack(currTrack+1));


    // Playlist Drawer
    const plDrawer = document.getElementById('playlist-drawer');
    document.getElementById('toggle-playlist').addEventListener('click', () => plDrawer.classList.toggle('open'));
    function renderPlaylist() {
      const pTrack = document.getElementById('playlist-tracks'); pTrack.innerHTML = '';
      PLAYLIST.forEach((t, i) => {
        const d = document.createElement('div'); d.className = `playlist-item ${i===currTrack?'active':''}`;
        d.textContent = `${i+1}. ${t.title}`;
        d.addEventListener('click', () => { isPlaying=true; loadTrack(i); document.getElementById('btn-play').textContent='Ⅱ'; bodyEl.classList.add('audio-reactive'); loop(); });
        pTrack.appendChild(d);
      });
    }
    renderPlaylist();
    document.getElementById('add-local-btn').addEventListener('click', () => document.getElementById('local-audio').click());
    document.getElementById('local-audio').addEventListener('change', e => {
      Array.from(e.target.files).forEach(f => PLAYLIST.push({title: f.name.split('.')[0], src: URL.createObjectURL(f)}));
      loadTrack(PLAYLIST.length-1); document.getElementById('btn-play').click();
    });


    // Master Render Loop (Combines Beat detection, UI scaling, Spectrum Canvas, and Rain)
    function loop() {
      if(!isPlaying) return;
      requestAnimationFrame(loop);
      const now = performance.now();
      
      // Audio Data
      let bass = 0;
      if(!useSimul && analyser) {
        analyser.getByteFrequencyData(dataArr);
        bass = (dataArr[1] + dataArr[2] + dataArr[3]) / 3;
      } else {
        bass = 70 + Math.sin(now*0.01)*50;
        dataArr = new Uint8Array(64).map((_,i)=> bass - i + Math.random()*20);
      }


      // Beat Logic
      if(bass > Math.max(30, avgBass*1.2) && now - lastBeatTime > 200 && !isZenMode) {
        beatPulse = Math.min(1, bass/150); lastBeatTime = now; clubHue = (clubHue+45)%360;
      }
      avgBass = avgBass*0.95 + bass*0.05; beatPulse *= 0.88; clubHue = (clubHue+0.5)%360;
      
      if(!isZenMode) {
        const beat = beatPulse < 0.05 ? 0 : beatPulse;
        bodyEl.style.setProperty('--beat-scale', 1 + beat * 0.04);
        bodyEl.style.setProperty('--beat-x', (Math.sin(now*0.05)*beat*5) + "px");
        bodyEl.style.setProperty('--beat-glow', beat.toFixed(2));
        bodyEl.style.setProperty('--club-hue', clubHue+"deg");
      }


      // Render Spectrum Canvas
      sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
      if(dataArr) {
        const barW = (sCanvas.width / dataArr.length) * 2.5;
        let x = 0;
        for(let i=0; i<dataArr.length; i++) {
          const barH = (dataArr[i]/255) * sCanvas.height;
          sCtx.fillStyle = isZenMode ? `rgba(255,183,3,${dataArr[i]/255})` : `hsla(${clubHue + i*2}, 100%, 60%, 0.8)`;
          sCtx.beginPath(); sCtx.roundRect(x, sCanvas.height - barH, barW - 2, barH, [4,4,0,0]); sCtx.fill();
          x += barW;
        }
      }


      // Render Rain Canvas if Zen Mode
      if(isZenMode) {
        rCtx.clearRect(0, 0, rCanvas.width, rCanvas.height);
        rCtx.strokeStyle = 'rgba(255,255,255,0.4)'; rCtx.lineWidth = 1;
        rCtx.beginPath();
        raindrops.forEach(p => {
          rCtx.moveTo(p.x, p.y); rCtx.lineTo(p.x + p.l*0.2, p.y + p.l);
          p.y += p.v; p.x += p.v*0.2;
          if(p.y > rCanvas.height) { p.y = -20; p.x = Math.random()*rCanvas.width; }
        });
        rCtx.stroke();
      }
    }


    /* =========================================
       5. PWA (SERVICE WORKER INJECTION)
    ========================================= */
    try {
      const swCode = `
        const CACHE = 'bacii-v1';
        self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const swUrl = URL.createObjectURL(new Blob([swCode], {type:'text/javascript'}));
      if('serviceWorker' in navigator) navigator.serviceWorker.register(swUrl);
      
      const manifest = { "name": "BACII 2027 Room", "short_name": "BACII", "display": "standalone", "background_color": "#060913", "theme_color": "#4facfe" };
      const manifestUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/json'}));
      document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestUrl}">`);
    } catch(e) {}
  </script>

</body>
</html>
