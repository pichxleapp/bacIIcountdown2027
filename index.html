<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1b">
  <meta name="description" content="A live countdown to BACII 2027.">
  <title>BACII 2027 — Countdown</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. DESIGN TOKENS
    ========================================================= */
    :root {
      color-scheme: dark;
      --font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --color-bg: #080d1b;
      --color-surface: rgba(255, 255, 255, 0.065);
      --color-border: rgba(255, 255, 255, 0.13);
      --color-text: #fff;
      --color-muted: rgba(255, 255, 255, 0.64);
      --color-accent: #4facfe;
      --color-accent-bright: #00e7f5;
      --shadow-card: 0 32px 90px rgba(0, 0, 0, 0.42);
      --radius-card: 30px;
    }

    /* =========================================================
       2. RESET & BASE
    ========================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: clamp(16px, 3vw, 28px);
      display: grid;
      place-items: center;
      overflow-x: hidden;
      isolation: isolate;
      font-family: var(--font-family);
      color: var(--color-text);
      background:
        radial-gradient(circle at 14% 18%, rgba(79, 172, 254, 0.19), transparent 32%),
        radial-gradient(circle at 86% 82%, rgba(0, 231, 245, 0.12), transparent 32%),
        linear-gradient(135deg, #070b16 0%, #101a33 55%, #16264a 100%);
    }

    body::before {
      position: fixed;
      z-index: -2;
      inset: -50%;
      content: "";
      pointer-events: none;
      background: conic-gradient(
        from 0deg,
        transparent,
        rgba(79, 172, 254, 0.075),
        transparent,
        rgba(0, 231, 245, 0.06),
        transparent
      );
      animation: background-rotation 28s linear infinite;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================================================
       3. BACKGROUND PARTICLES
    ========================================================= */
    .particles {
      position: fixed;
      z-index: -1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      bottom: -12px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 10px rgba(79, 172, 254, 0.8);
      animation: particle-float linear infinite;
    }

    /* =========================================================
       4. MAIN CARD
    ========================================================= */
    .countdown-card {
      width: min(950px, 100%);
      padding: clamp(26px, 5vw, 60px);
      text-align: center;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.085),
        rgba(255, 255, 255, 0.035)
      );
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card), inset 0 1px 1px rgba(255, 255, 255, 0.08);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      animation: card-entrance 850ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    /* =========================================================
       5. HEADER
    ========================================================= */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      padding: 8px 15px;
      color: var(--color-accent-bright);
      background: rgba(0, 231, 245, 0.07);
      border: 1px solid rgba(0, 231, 245, 0.17);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--color-accent-bright);
      box-shadow: 0 0 12px var(--color-accent-bright);
      animation: status-pulse 1.6s ease-in-out infinite;
    }

    .page-title {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1.5px;
      color: #fff;
      background: linear-gradient(135deg, #fff 10%, #8fdcff 55%, #00e7f5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-subtitle {
      margin: 12px 0 0;
      color: var(--color-muted);
      font-size: clamp(0.78rem, 2.2vw, 1rem);
      font-weight: 300;
      letter-spacing: 0.8px;
    }

    /* =========================================================
       6. COUNTDOWN UNITS
    ========================================================= */
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(10px, 2vw, 20px);
      margin-top: clamp(28px, 5vw, 46px);
    }

    .time-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      padding: clamp(17px, 3vw, 30px) 10px;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.075),
        rgba(0, 0, 0, 0.16)
      );
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      transition:
        transform 280ms ease,
        border-color 280ms ease,
        box-shadow 280ms ease;
    }

    .time-card::before {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, var(--color-accent-bright), transparent);
      animation: card-shine 4.5s linear infinite;
    }

    .time-card:hover {
      transform: translateY(-6px);
      border-color: rgba(79, 172, 254, 0.38);
      box-shadow: 0 14px 36px rgba(0, 231, 245, 0.09);
    }

    .time-value {
      display: block;
      color: #fff;
      font-size: clamp(1.8rem, 6vw, 4.25rem);
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 25px rgba(79, 172, 254, 0.35);
    }

    .time-value.tick {
      animation: number-tick 240ms ease;
    }

    .time-label {
      display: block;
      margin-top: 11px;
      color: var(--color-accent-bright);
      font-size: clamp(0.58rem, 1.6vw, 0.75rem);
      font-weight: 600;
      letter-spacing: clamp(1px, 0.45vw, 2.5px);
      text-transform: uppercase;
    }

    /* =========================================================
       7. PROGRESS
    ========================================================= */
    .progress-section {
      margin-top: clamp(28px, 5vw, 40px);
      text-align: left;
    }

    .progress-heading {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
      color: var(--color-muted);
      font-size: 12px;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.085);
      border-radius: 999px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--color-accent-bright), var(--color-accent));
      box-shadow: 0 0 15px rgba(0, 231, 245, 0.55);
      transition: width 700ms ease;
    }

    /* =========================================================
       8. FOOTER INFORMATION
    ========================================================= */
    .footer-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 25px;
    }

    .current-time {
      color: var(--color-muted);
      font-size: 12px;
      letter-spacing: 0.35px;
    }

    .current-time strong,
    .target-date strong {
      color: #fff;
      font-weight: 600;
    }

    .target-date {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      color: var(--color-muted);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      font-size: 12px;
    }

    /* =========================================================
       9. COMPLETED STATE
    ========================================================= */
    .completion-message {
      grid-column: 1 / -1;
      padding: 38px 10px;
      color: #fff;
      background: linear-gradient(135deg, #fff, var(--color-accent-bright));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: clamp(1.35rem, 5vw, 3rem);
      font-weight: 800;
      animation: celebration 1s ease-in-out infinite alternate;
    }

    /* =========================================================
       10. ANIMATIONS
    ========================================================= */
    @keyframes background-rotation {
      to { transform: rotate(360deg); }
    }

    @keyframes particle-float {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      10%, 90% { opacity: 1; }
      100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
    }

    @keyframes card-entrance {
      from { opacity: 0; transform: translateY(28px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes status-pulse {
      0%, 100% { opacity: 0.55; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes card-shine {
      to { left: 100%; }
    }

    @keyframes number-tick {
      50% {
        transform: translateY(-3px) scale(1.035);
        text-shadow: 0 0 32px rgba(0, 231, 245, 0.75);
      }
    }

    @keyframes celebration {
      to { transform: scale(1.035); }
    }

    /* =========================================================
       11. RESPONSIVE LAYOUT
    ========================================================= */
    @media (max-width: 768px) {
      .countdown-card {
        border-radius: 24px;
      }

      .countdown-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .countdown-card {
        padding: 28px 16px;
      }

      .countdown-grid {
        gap: 11px;
      }

      .time-card {
        padding: 17px 6px;
        border-radius: 14px;
      }

      .time-value {
        font-size: 2rem;
      }

      .time-label {
        font-size: 0.58rem;
        letter-spacing: 1px;
      }

      .progress-heading,
      .current-time,
      .target-date {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <main class="countdown-card">
    <header class="page-header">
      <div class="status-badge">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Good Luck</span>
      </div>

      <h1 class="page-title">BACII 2027</h1>
      <p class="page-subtitle">Knowledge is the key to success</p>
    </header>

    <section
      class="countdown-grid"
      id="countdown"
      aria-label="Time remaining until August 10, 2027"
      aria-live="off"
    >
      <div class="time-card">
        <span class="time-value" id="days">00</span>
        <span class="time-label">Days</span>
      </div>
      <div class="time-card">
        <span class="time-value" id="hours">00</span>
        <span class="time-label">Hours</span>
      </div>
      <div class="time-card">
        <span class="time-value" id="minutes">00</span>
        <span class="time-label">Minutes</span>
      </div>
      <div class="time-card">
        <span class="time-value" id="seconds">00</span>
        <span class="time-label">Seconds</span>
      </div>
    </section>

    <section class="progress-section" aria-label="Countdown progress">
      <div class="progress-heading">
        <span>Progress</span>
        <span id="progress-text">0.00%</span>
      </div>
      <div
        class="progress-track"
        id="progress-track"
        role="progressbar"
        aria-label="Progress toward BACII 2027"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <footer class="footer-info">
      <p class="current-time">
        Cambodia Time (UTC+7):
        <strong id="current-time">Loading...</strong>
      </p>

      <div class="target-date">
        <span>Target:</span>
        <strong>និន្ទេស C</strong>
      </div>
    </footer>
  </main>

  <script>
    "use strict";

    /* =========================================================
       1. COUNTDOWN CONFIGURATION
       Update these values when changing the countdown period.
    ========================================================= */
    const CONFIG = Object.freeze({
      startDate: "2026-08-18T00:00:00+07:00",
      targetDate: "2027-08-10T00:00:00+07:00",
      timeZone: "Asia/Phnom_Penh",
      particleCount: {
        mobile: 22,
        desktop: 40
      }
    });

    const START_TIMESTAMP = new Date(CONFIG.startDate).getTime();
    const TARGET_TIMESTAMP = new Date(CONFIG.targetDate).getTime();
    const TOTAL_DURATION = TARGET_TIMESTAMP - START_TIMESTAMP;
    const SECOND_IN_MS = 1000;
    const MINUTE_IN_MS = 60 * SECOND_IN_MS;
    const HOUR_IN_MS = 60 * MINUTE_IN_MS;
    const DAY_IN_MS = 24 * HOUR_IN_MS;

    /* =========================================================
       2. DOM REFERENCES
    ========================================================= */
    const elements = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds"),
      countdown: document.getElementById("countdown"),
      progressFill: document.getElementById("progress-fill"),
      progressText: document.getElementById("progress-text"),
      progressTrack: document.getElementById("progress-track"),
      currentTime: document.getElementById("current-time"),
      particles: document.getElementById("particles")
    };

    let countdownIntervalId = null;
    let clockIntervalId = null;
    let isCompleted = false;

    /* =========================================================
       3. UTILITY FUNCTIONS
    ========================================================= */
    function padNumber(value) {
      return String(value).padStart(2, "0");
    }

    function setAnimatedNumber(element, value) {
      const formattedValue = padNumber(value);

      if (element.textContent === formattedValue) {
        return;
      }

      element.textContent = formattedValue;
      element.classList.remove("tick");

      // Restart the animation only when the displayed value changes.
      void element.offsetWidth;
      element.classList.add("tick");
    }

    /* =========================================================
       4. CAMBODIA CLOCK
    ========================================================= */
    function updateCurrentTime() {
      const now = new Date();

      const formattedTime = new Intl.DateTimeFormat("en-GB", {
        timeZone: CONFIG.timeZone,
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(now);

      elements.currentTime.textContent = formattedTime;
    }

    /* =========================================================
       5. PROGRESS INDICATOR
    ========================================================= */
    function updateProgress(now) {
      const elapsed = now - START_TIMESTAMP;
      const progress = TOTAL_DURATION > 0
        ? Math.min(100, Math.max(0, (elapsed / TOTAL_DURATION) * 100))
        : 100;

      const roundedProgress = Number(progress.toFixed(2));

      elements.progressFill.style.width = `${roundedProgress}%`;
      elements.progressText.textContent = `${roundedProgress.toFixed(2)}%`;
      elements.progressTrack.setAttribute("aria-valuenow", String(roundedProgress));
    }

    /* =========================================================
       6. COUNTDOWN ENGINE
    ========================================================= */
    function renderCompletionState() {
      if (isCompleted) {
        return;
      }

      isCompleted = true;
      elements.countdown.innerHTML = `
        <div class="completion-message">
          🎉 The Day Has Arrived!
        </div>
      `;

      elements.progressFill.style.width = "100%";
      elements.progressText.textContent = "100.00%";
      elements.progressTrack.setAttribute("aria-valuenow", "100");

      if (countdownIntervalId !== null) {
        window.clearInterval(countdownIntervalId);
        countdownIntervalId = null;
      }
    }

    function updateCountdown() {
      const now = Date.now();
      const remainingTime = TARGET_TIMESTAMP - now;

      updateProgress(now);

      if (remainingTime <= 0) {
        renderCompletionState();
        return;
      }

      const days = Math.floor(remainingTime / DAY_IN_MS);
      const hours = Math.floor((remainingTime % DAY_IN_MS) / HOUR_IN_MS);
      const minutes = Math.floor((remainingTime % HOUR_IN_MS) / MINUTE_IN_MS);
      const seconds = Math.floor((remainingTime % MINUTE_IN_MS) / SECOND_IN_MS);

      setAnimatedNumber(elements.days, days);
      setAnimatedNumber(elements.hours, hours);
      setAnimatedNumber(elements.minutes, minutes);
      setAnimatedNumber(elements.seconds, seconds);
    }

    /* =========================================================
       7. PARTICLE GENERATOR
    ========================================================= */
    function createParticles() {
      const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      if (prefersReducedMotion) {
        return;
      }

      const isMobile = window.matchMedia("(max-width: 600px)").matches;
      const particleCount = isMobile
        ? CONFIG.particleCount.mobile
        : CONFIG.particleCount.desktop;

      const fragment = document.createDocumentFragment();

      for (let index = 0; index < particleCount; index += 1) {
        const particle = document.createElement("span");
        const size = 1 + Math.random() * 2.5;

        particle.className = "particle";
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.animationDuration = `${9 + Math.random() * 14}s`;
        particle.style.animationDelay = `${Math.random() * 15}s`;

        fragment.appendChild(particle);
      }

      elements.particles.appendChild(fragment);
    }

    /* =========================================================
       8. INITIALIZATION
    ========================================================= */
    function initializeCountdown() {
      if (
        !Number.isFinite(START_TIMESTAMP) ||
        !Number.isFinite(TARGET_TIMESTAMP) ||
        TOTAL_DURATION <= 0
      ) {
        console.error("Invalid countdown configuration. Check startDate and targetDate.");
        return;
      }

      createParticles();
      updateCurrentTime();
      updateCountdown();

      // Keep the clock and countdown synchronized with real time.
      clockIntervalId = window.setInterval(updateCurrentTime, SECOND_IN_MS);

      if (!isCompleted) {
        countdownIntervalId = window.setInterval(updateCountdown, SECOND_IN_MS);
      }
    }

    initializeCountdown();

    // Avoid unnecessary background updates while the page is hidden.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (countdownIntervalId !== null) {
          window.clearInterval(countdownIntervalId);
          countdownIntervalId = null;
        }

        if (clockIntervalId !== null) {
          window.clearInterval(clockIntervalId);
          clockIntervalId = null;
        }

        return;
      }

      updateCurrentTime();
      updateCountdown();

      if (clockIntervalId === null) {
        clockIntervalId = window.setInterval(updateCurrentTime, SECOND_IN_MS);
      }

      if (!isCompleted && countdownIntervalId === null) {
        countdownIntervalId = window.setInterval(updateCountdown, SECOND_IN_MS);
      }
    });
  </script>
</body>
</html>
