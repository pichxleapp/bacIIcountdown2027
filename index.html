<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown — August 10, 2027</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =====================================================
       ROOT
    ===================================================== */
    :root {
      --font: 'Poppins', sans-serif;
      --bg-1: #070b16;
      --bg-2: #101a33;
      --bg-3: #16264a;
      --accent: #4facfe;
      --accent-2: #00f2fe;
      --white: #ffffff;
      --muted: rgba(255,255,255,.62);
      --glass: rgba(255,255,255,.065);
      --glass-border: rgba(255,255,255,.13);
      --shadow: rgba(0,0,0,.45);
    }

    /* =====================================================
       RESET
    ===================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(15px, 3vw, 25px);
      font-family: var(--font);
      color: var(--white);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(79,172,254,.20), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(0,242,254,.13), transparent 30%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
    }

    /* =====================================================
       ANIMATED BACKGROUND
    ===================================================== */
    body::before {
      content: "";
      position: fixed;
      inset: -50%;
      background: conic-gradient(from 0deg, transparent, rgba(79,172,254,.08), transparent, rgba(0,242,254,.07), transparent);
      animation: rotateBG 25s linear infinite;
      pointer-events: none;
      z-index: -2;
    }

    @keyframes rotateBG {
      to { transform: rotate(360deg); }
    }

    /* =====================================================
       PARTICLES
    ===================================================== */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255,255,255,.5);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(79,172,254,.8);
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% { transform: translateY(110vh) scale(.5); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* =====================================================
       MAIN CONTAINER
    ===================================================== */
    .container {
      width: min(950px, 100%);
      padding: clamp(25px, 5vw, 60px);
      text-align: center;
      background: linear-gradient(135deg, rgba(255,255,255,.085), rgba(255,255,255,.035));
      border: 1px solid var(--glass-border);
      border-radius: clamp(20px, 4vw, 32px);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: 0 35px 100px var(--shadow), inset 0 1px 1px rgba(255,255,255,.08);
      animation: containerIn 1s ease-out;
    }

    @keyframes containerIn {
      from { opacity: 0; transform: translateY(35px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* =====================================================
       HEADER
    ===================================================== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      margin-bottom: 18px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-2);
      background: rgba(0,242,254,.07);
      border: 1px solid rgba(0,242,254,.15);
      border-radius: 999px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background: var(--accent-2);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-2);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: .5; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .title {
      font-size: clamp(28px, 6vw, 64px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 10%, #8fdcff 50%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: clamp(12px, 2.5vw, 16px);
      font-weight: 300;
      letter-spacing: 1px;
    }

    /* =====================================================
       COUNTDOWN
    ===================================================== */
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(10px, 2vw, 20px);
      margin-top: clamp(25px, 5vw, 45px);
    }

    .box {
      position: relative;
      min-width: 0;
      padding: clamp(15px, 3vw, 30px) 10px;
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(0,0,0,.16));
      border: 1px solid rgba(255,255,255,.10);
      border-radius: clamp(12px, 3vw, 20px);
      overflow: hidden;
      transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease;
    }

    .box::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      to { left: 100%; }
    }

    .box:hover {
      transform: translateY(-8px) scale(1.025);
      border-color: rgba(79,172,254,.35);
      box-shadow: 0 15px 40px rgba(0,242,254,.10);
    }

    .number {
      display: block;
      font-size: clamp(28px, 6vw, 68px);
      line-height: 1;
      font-weight: 700;
      color: white;
      text-shadow: 0 0 25px rgba(79,172,254,.35);
      transition: transform .2s ease;
    }

    .number.tick {
      animation: numberTick .25s ease;
    }

    @keyframes numberTick {
      50% { transform: translateY(-4px) scale(1.04); text-shadow: 0 0 35px rgba(0,242,254,.8); }
    }

    .label {
      display: block;
      margin-top: 10px;
      color: var(--accent-2);
      font-size: clamp(10px, 1.8vw, 12px);
      font-weight: 600;
      letter-spacing: clamp(1px, .5vw, 3px);
      text-transform: uppercase;
    }

    /* =====================================================
       PROGRESS
    ===================================================== */
    .progress-section {
      margin-top: clamp(25px, 5vw, 38px);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .progress-bar {
      width: 100%;
      height: 7px;
      background: rgba(255,255,255,.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      box-shadow: 0 0 15px rgba(0,242,254,.6);
      transition: width 1s ease;
    }

    /* =====================================================
       BOTTOM INFO (Time & Target)
    ===================================================== */
    .info-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 25px;
    }

    .current-time {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .5px;
    }

    .current-time strong {
      color: white;
      font-weight: 500;
    }

    .target-date {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 9px 18px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
    }

    .target-date strong {
      color: white;
      font-weight: 600;
    }

    .finished {
      grid-column: 1 / -1;
      padding: 40px 10px;
      font-size: clamp(20px, 5vw, 48px);
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: celebration 1s ease-in-out infinite alternate;
    }

    @keyframes celebration {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    /* =====================================================
       RESPONSIVE DESIGN (Media Queries)
    ===================================================== */
    
    /* សម្រាប់ Tablet និងទូរស័ព្ទធំមធ្យម */
    @media (max-width: 768px) {
      .countdown {
        grid-template-columns: repeat(2, 1fr); /* ប្តូរទៅជា ២ ជួរ */
        gap: 15px;
      }
      .info-container {
        flex-direction: column;
      }
    }

    /* សម្រាប់ទូរស័ព្ទតូចៗ (Mobile Phones) */
    @media (max-width: 480px) {
      .container {
        padding: 30px 15px;
      }
      .countdown {
        gap: 12px;
      }
      .box {
        padding: 15px 5px;
      }
      .number {
        font-size: 32px;
      }
      .label {
        font-size: 9px;
        letter-spacing: 1px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       PARTICLES
  ====================================================== -->
  <div class="particles" id="particles"></div>

  <!-- =====================================================
       MAIN
  ====================================================== -->
  <main class="container">
    <div class="badge">
      <span class="badge-dot"></span>
      GOOD LUCK
    </div>

    <h1 class="title">BACII 2027</h1>
    <p class="subtitle">Knowledge is the key to success</p>

    <!-- ===================================================
         COUNTDOWN
    ==================================================== -->
    <div class="countdown" id="countdown-wrapper">
      <div class="box">
        <span id="days" class="number">00</span>
        <span class="label">Days</span>
      </div>
      <div class="box">
        <span id="hours" class="number">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="box">
        <span id="minutes" class="number">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="box">
        <span id="seconds" class="number">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <!-- ===================================================
         PROGRESS
    ==================================================== -->
    <div class="progress-section">
      <div class="progress-info">
        <span>Progress</span>
        <span id="progress-text">0.00%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- ===================================================
         BOTTOM INFO
    ==================================================== -->
    <div class="current-time">

      Cambodia Time (UTC+7):

      <strong id="current-time">
        Loading...
      </strong>
      <div class="target-date">
        Target:
        <strong>និន្ទេស C</strong>
      </div>
    </div>

  </main>

  <script>
    /* =====================================================
       SETTINGS
    ===================================================== */
    const TARGET_DATE = new Date("2027-08-10T00:00:00+07:00").getTime();
    const START_DATE = new Date("2026-08-18T00:00:00+07:00").getTime();

    /* =====================================================
       ELEMENTS
    ===================================================== */
    const daysElement = document.getElementById("days");
    const hoursElement = document.getElementById("hours");
    const minutesElement = document.getElementById("minutes");
    const secondsElement = document.getElementById("seconds");
    const progressFill = document.getElementById("progress-fill");
    const progressText = document.getElementById("progress-text");
    const currentTimeElement = document.getElementById("current-time");
    const countdownWrapper = document.getElementById("countdown-wrapper");

    function pad(number) {
      return String(number).padStart(2, "0");
    }

    function updateNumber(element, value) {
      const formatted = pad(value);
      if (element.textContent !== formatted) {
        element.textContent = formatted;
        element.classList.remove("tick");
        void element.offsetWidth; // Force reflow
        element.classList.add("tick");
      }
    }

    function updateCurrentTime() {
      const now = new Date();
      const cambodiaTime = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Phnom_Penh",
        year: "numeric", month: "long", day: "numeric",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: false
      }).format(now);
      currentTimeElement.textContent = cambodiaTime;
    }

    function updateCountdown() {
      const now = Date.now();
      const difference = TARGET_DATE - now;

      if (difference <= 0) {
        countdownWrapper.innerHTML = `
          <div class="finished">
            🎉 The Day Has Arrived!
          </div>
        `;
        progressFill.style.width = "100%";
        progressText.textContent = "100%";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      updateNumber(daysElement, days);
      updateNumber(hoursElement, hours);
      updateNumber(minutesElement, minutes);
      updateNumber(secondsElement, seconds);

      const totalDuration = TARGET_DATE - START_DATE;
      const elapsed = now - START_DATE;
      let progress = (elapsed / totalDuration) * 100;
      progress = Math.max(0, Math.min(100, progress));

      progressFill.style.width = progress + "%";
      progressText.textContent = progress.toFixed(2) + "%";
    }

    function createParticles() {
      const container = document.getElementById("particles");
      const amount = window.innerWidth < 600 ? 25 : 45;

      for (let i = 0; i < amount; i++) {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.animationDuration = (8 + Math.random() * 15) + "s";
        particle.style.animationDelay = Math.random() * 15 + "s";
        const size = 1 + Math.random() * 3;
        particle.style.width = size + "px";
        particle.style.height = size + "px";
        container.appendChild(particle);
      }
    }

    createParticles();
    updateCountdown();
    updateCurrentTime();

    setInterval(updateCountdown, 1000);
    setInterval(updateCurrentTime, 1000);
  </script>
</body>
</html>
